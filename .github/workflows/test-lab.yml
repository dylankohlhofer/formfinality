name: Local-first test lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-lab-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Engine parity and deterministic local coaching contracts
        run: |
          set -o pipefail
          swift test --package-path swift/FormCoachEngine 2>&1 | tee swift-tests.log
      - name: Preserve Swift checks, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-review
          path: swift-tests.log
          retention-days: 14
          if-no-files-found: warn
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies and Chromium
        id: dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Infrastructure, original harnesses and shared scenarios
        run: npm test
      - name: Real inference on synthetic blank video (no people)
        if: always() && steps.dependencies.outcome == 'success'
        run: npm run test:setup-video && npm run test:video
      - name: Local web artifact and same-origin inference smoke (no deployment)
        run: npm run build:web -- --out dist/web-review && npm run test:release:smoke -- --dir dist/web-review
      - name: Preserve review evidence even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-review
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
