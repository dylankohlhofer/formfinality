Without it, stacking layers achieves nothing, a chain of linear operations collapses into a single linear operation, and you're back to drawing straight lines.", "The non-linearity is what lets networks represent curves, corners and conditions.", "The common choice, rel-you, is almost insultingly simple: max 0, x.", "Negative becomes zero, positive passes through.", "A network is these neurons in layers: inputs to hidden layers to outputs.", "\"Deep learning\" just means many layers.", "Training is the interesting part:", "Show it an image where you know the true joint positions (labelled training data)", "It predicts; you measure how wrong it is (loss function)", "Work out, for every single weight, which direction would reduce the error (backpropagation, the chain rule from calculus, applied at scale)", "Nudge all the weights slightly that way (gradient descent)", "Repeat millions of times", "The result is a function that generalises to images it's never seen, provided they resemble the training data.", "Which is exactly why your app should tell people not to wear baggy trousers: loose fabric moving independently of the leg is unlike the training data, so the estimate degrades. That backlog item is an M L constraint wearing a UX costume.", "2.4 Convolution: the idea that makes vision work", "A crucial detail: you can't just wire every pixel to every neuron. 2 million inputs times a hidden layer of 1000 = 2 billion weights in the first layer alone.", "Untrainable and absurd.", "Convolutional Neural Networks (CNNs) exploit two facts about images:", "Locality, a shoulder is a local arrangement of pixels.", "You don't need the top-left corner to identify something in the bottom-right.", "Translation invariance, a shoulder looks like a shoulder wherever it appears.", "The same detector should work everywhere.", "So instead of per-pixel weights, you learn a small kernel, say 3 times 3, and slide it across the whole image, computing a dot product at every position.", "That's a convolution.", "Nine weights, reused across two million pixels.", "Stack these, and something remarkable emerges: early layers learn edges, later ones learn corners and textures, later still learn body parts, and the deepest learn whole configurations.", "Nobody programmed that hierarchy, it falls out of training.", "2.5 How pose models output joint positions", "Two approaches, and the distinction explains a real property of your system.", "Heatmap regression. The network outputs, per joint, a grid where each cell holds \"how likely is this joint here\".", "You take the peak.", "Accurate, and naturally gives you a confidence value, but you need a full grid per joint, which is expensive.", "Direct regression. The network just outputs numbers: x, y for each joint.", "Much faster, usually slightly less accurate.", "BlazePose, what MediaPipe uses, is a hybrid, and cleverly so: it trains with a heatmap branch to get the accuracy benefit, then throws that branch away for inference and keeps only the regression head.", "You pay the heatmap cost during training, once, and get the speed at runtime, forever.", "It also uses a two-stage pipeline:", "A lightweight detector finds the person and a rough crop", "A landmark model runs on that crop and produces the joints", "And critically, on subsequent frames it skips the detector and reuses the previous frame's region, because bodies don't teleport.", "This is called tracking, and it's most of why real-time pose estimation is feasible on a phone at all.", "Consequence you can observe: when tracking is lost (you leave the frame), recovery takes noticeably longer than a normal frame, because the detector has to run again.", "Your vis cue (\"I can't see you\") exists for exactly this window.", "2.6 The 33 landmarks, confidence, and the z-coordinate", "BlazePose emits 33 landmarks: face points, shoulders, elbows, wrists, hands, hips, knees, ankles, heels, toes.", "Your engine names a subset, shoulder, hip, knee, ankle, heel, toe, ear, elbow, wrist, because those are the ones your movements need.", "Confidence ( c in your Joint ) is the model's own estimate of reliability, 0 to 1.", "Your engine gates on it:", "This is a small idea with a big payoff: a model that reports its own uncertainty lets you decline to answer. A coach that says \"I can't see you properly\" is infinitely better than one that confidently corrects a shape it hasn't actually seen.", "The z-coordinate deserves scepticism.", "BlazePose does emit depth, estimated via a synthetic 3D human model (GHUM) during training.", "But it's inferred from a single 2D image, not measured, so it's far less reliable than x and y.", "Your architecture treats it appropriately: z feeds sideness, a coarse \"how side-on is this person\" judgement, and nothing else.", "Coarse question, coarse-but-adequate signal.", "If you ever tried to measure knee valgus in degrees from z, you'd be building on sand.", "This is also the crux of the any-angle question in your backlog, and why that experiment needs a hard validation gate ( at most 4 degrees) before anything depends on it.", "2.7 Why this runs on the phone at all", "Three things make on-device inference practical, and they're worth knowing because they're the technical foundation of your entire business model:", "Small models. BlazePose Lite is a few megabytes.", "Compare a large language model at tens of gigabytes.", "Quantisation. Weights are stored at reduced precision, 8-bit integers instead of 32-bit floats.", "Four times smaller, substantially faster, negligible accuracy loss for this task.", "Hardware acceleration. Phones have GPUs and dedicated neural accelerators (Apple's Neural Engine).", "MediaPipe dispatches to them automatically.", "Net result: ~10 milliseconds per frame on a modern phone, well inside a 33 milliseconds budget at 30 F P S.", "And this is why \"zero running costs, \u00a34.99 once\" is possible. Not a pricing trick, a direct consequence of the inference happening on hardware the user already owns and paid for.", "Your competitors' subscriptions largely fund servers you don't need.", "Part 3, Taming a noisy signal", "3.1 Every measurement is wrong", "Point a pose model at a perfectly still person and the landmarks still jitter, a degree or two, frame to frame.", "Sources: sensor noise, compression artefacts, lighting flicker, and the model itself being a continuous function fed slightly different pixels each frame.", "Left raw, this makes a coach unusable: the score flickers, cues fire and unfire, reps double-count.", "Cleaning up noisy measurements is signal processing, and it's most of what separates a demo from a product.", "3.2 The exponential moving average", "The workhorse.", "Each frame, move your stored estimate a fraction of the way toward the new reading:", "alpha (alpha) between 0 and 1 controls responsiveness:", "alpha equals 1 to estimate is the measurement (no smoothing)", "alpha equals 0.35 to moves a third of the way each frame (your per-target default)", "alpha equals 0.1 to slow and stable (your form score)", "alpha equals 0.02 to glacial (your rep baseline drift)", "It's called exponential because the influence of any old reading decays exponentially, each frame multiplies its remaining weight by 1\u2212alpha.", "Every past measurement contributes something, but recent ones dominate.", "Beautifully, it needs one stored number rather than a history buffer, which is why it's everywhere in embedded and real-time systems.", "The engineering trade-off is unavoidable: more smoothing = less noise but more lag.", "Your score uses alpha equals 0.1 because a form score should feel stable; your target readings use 0.35 because a cue must arrive while the fault is still happening. Late coaching is wrong coaching.", "3.3 The frame-rate trap, a fundamental error we shipped", "Here's the deepest lesson in this document.", "The formula above advances once per frame.", "So the amount of smoothing depends on how many frames happen, not how much time passes.", "At 60 F P S you get twice as many updates per second as at 30 F P S, so the same filter converges twice as fast.", "Your thresholds were tuned in a browser at a steady 30 F P S.", "On a phone, frame rate varies with device, thermal state and capture pipeline.", "Measured on the same physical movement, the score filter read:", "The filter ran 3.74 times faster at 90 F P S than at 24 F P S.", "Every constant downstream, the praise window, the early-stop threshold, cue timing, silently inherited that error.", "The fix, think in time, not frames. Express the filter as a time constant and convert per frame using the actual elapsed time delta t:", "Read it as: \"what single step is equivalent to delta t over REF DT steps of the old filter?\" At exactly 30 F P S it returns alpha unchanged, which is why every existing test and vector still passed, proving it a pure generalisation rather than a behaviour change.", "The principle, and it applies far beyond this project:", "Anything that evolves over time should be a function of elapsed time, never of how many times your code happened to run.", "Related concept: delta t (delta time) is the interval since the last frame, and it should appear in every physics-like calculation.", "Your hold clock ( hold plus equals delta t ) was already correct; the filters weren't.", "A second-order version of the same bug appeared minutes later.", "The score trace sampled every 6 frames, twice as dense at 60 F P S, skewing the fatigue-vs-technique classifier.", "Switching to a clock check then drifted through floating-point accumulation (adding 1/30 repeatedly never lands exactly on 0.2), giving 53 samples at 30 F P S versus 58 at 60.", "The final fix computes a bucket index, floor elapsed over 0.2, which is exact at any rate.", "Lesson: derive from an absolute quantity rather than accumulating increments.", "3.4 Hysteresis: two thresholds, not one", "Counting reps by asking \"is the hip angle above 162 degrees?\" fails immediately.", "When someone hovers near the threshold, noise flips the answer every frame and you count twenty reps in a second.", "Hysteresis uses two thresholds with a gap between them, plus a memory of which state you're in:", "Between 140 and 162 nothing changes, you stay wherever you were.", "Noise would have to swing 22 degrees to cause a false count.", "Your thermostat works the same way, for the same reason.", "3.5 Debouncing, and the two ways a rep can fail", "Hysteresis handles noise.", "It doesn't handle a person genuinely bouncing through half-repetitions using momentum.", "That needs a time test, a debounce:", "This was declared in your content since v4 and never read until v4.8, dead configuration that read as implemented.", "Now enforced, scaled by tier (Strong 0.6 times, because a trained body legitimately moves faster).", "The design decision that matters more than the mechanism: rejected reps are never silent. The coach says \"slower, control it, and I'll count it.\" A rep the person definitely performed vanishing without explanation reads as a broken app.", "And its counterpart, added in the same release: short-range detection. Progress toward the threshold is tracked as a fraction (0 at rest, 1 at the threshold); leaving rest, reaching 40-99%, and returning without crossing means an attempted rep that didn't make it to \"go a bit deeper.\" Below 40% is ignored, so shifting position isn't nagged at.", "Why this couldn't be a per-frame check, and this is the conceptual heart of it:", "A rep driver is graded against a fixed ideal pose. squat.knee Bend has ideal 175 degrees (legs straight) but the rep requires going below 110 degrees.", "A per-frame cue would therefore fire at the bottom of every good rep.", "Which is precisely the bug we found shipped in glute-bridge, the app said \"Higher, squeeze at the top!\" while the user was correctly at the bottom of the movement.", "A shortfall is a property of the whole cycle, not of any single frame. Choosing the right unit of analysis, frame, cycle, set, session, is a design decision, and getting it wrong produces confident nonsense.", "Part 4, From measurements to judgements", "4.1 Scoring: continuous, with a forgiving core", "Given a measured angle, how good is it?", "Your score Target:", "Three deliberate design choices, each worth naming:", "The dead zone ( tol ). Inside tolerance, everything scores 100.", "Without it, the score would twitch constantly and nobody is exactly at 180 degrees.", "This is the numerical expression of \"good enough is good enough\", and it's why the whole system feels kind rather than pedantic.", "Linear falloff, not a cliff. Beyond tolerance the score degrades smoothly.", "Small errors cost a little, big errors cost a lot.", "A step function would make the coach feel arbitrary.", "Clamped at zero. Terrible is terrible; there's no negative.", "This shape, piecewise linear, is a common and underrated choice.", "It's trivial to reason about, trivial to debug, and behaves predictably at the edges, where clever curves tend to surprise you.", "Tolerance is the tier system's main lever: the same tol is multiplied by 1.9 for Learning, 1.25 for Building, 1.0 for Strong.", "One number, applied consistently, expresses \"be gentler with beginners\" across all 21 movements without duplicating any content.", "4.2 Booleans and continuous values are different tools", "Your targets do two distinct jobs, and keeping them distinct is what makes the engine coherent:", "Gates answer yes/no. pos true decides is this person even in the position (should the set start?). gate true decides is this good enough to count as holding it (should the clock run?).", "Graded targets answer how-well, feeding the weighted score.", "The split matters because they have different failure modes.", "A gate being slightly wrong stops the session; a graded target being slightly wrong nudges a number.", "Conflating them, \"if the score drops below 50, stop the clock\", makes both jobs worse.", "4.3 Weighted averages, and a nasty edge case", "Combining several target scores into one number:", "Weight expresses what actually matters for this movement.", "In a plank, hip Align carries w 2 while other targets carry 1, because a plank essentially is the straightness of the body.", "The edge case: w 0 means \"measure this, but don't grade it\", used for rep drivers, where the driver's instantaneous value is about counting, not quality.", "But if every target in a movement has w 0, the denominator is zero and you compute 0 over 0 equals Na N, which propagates silently through every subsequent calculation and poisons the display.", "Your engine handles it with a fallback chain: graded targets to else quality gates to else all readings.", "Defensive, and the alternative is a form score reading \"NaN\" to a beginner.", "4.4 Choosing what to say: selection under constraints", "A beginner receiving four corrections at once will do none of them.", "This is a real cognitive constraint, not a U I preference, and your engine encodes it in three layers:", "Worst-offender selection. Sort the failing targets by score, take the lowest.", "One cue, the most important one.", "Cue budget. Learning tier allows one distinct cue per set.", "Building allows two.", "Strong is effectively uncapped.", "Once the budget is spent, other faults are noted for the debrief rather than voiced.", "Cooldown. Even the same cue won't repeat within 9 s (Learning) / 6 s / 4 s.", "Silence is a feature, it gives someone time to actually attempt the correction.", "A subtle implementation note with a real lesson:", "JavaScript's Array.sort is stable (equal elements keep their original order); Swift's is not guaranteed to be.", "So the Swift port sorts by score, index explicitly.", "Two ties broken differently would mean the two implementations say different things on the same input, an invisible divergence that no casual test would catch.", "4.5 Suppression: knowing when not to speak", "When sideness says the view is oblique (25-50 degrees), depth-dependent cues are dropped rather than voiced, they'd be measuring an artefact of the angle, not the body.", "They're logged as viewcue so the telemetry shows what would have been said and why it wasn't.", "That logging choice is worth stealing generally: record your suppressed decisions. A system that silently declines to act is very hard to debug otherwise.", "Part 5, Time, state and control flow", "5.1 State machines", "A state machine is a system that is always in exactly one of a fixed set of states, with defined rules for moving between them.", "It's one of the most useful concepts in all of programming, and your system has three.", "The rep counter: down and back to up, with hysteresis thresholds as the transition rules, plus a primed flag.", "That flag exists because a plank and a bridge lockout are geometrically identical, so nothing counts until a genuine resting position has been observed first.", "Without it, walking into position counts as a rep.", "The session: setup to active to (rest) to next step.", "The setup to active transition (\"arming\") requires both that the person has been in position for 1.2 s and that the coach has stopped talking.", "That second condition is a product decision, never start the clock while someone is still listening to the instructions.", "Speech: idle and back to speaking, with a priority queue underneath.", "Why the pattern earns its place: it makes illegal states unreachable.", "\"Counting reps before the set started\" isn't a bug you have to remember to prevent, it's a transition that doesn't exist.", "5.2 The event loop and request Animation Frame", "JavaScript is single-threaded: one thing at a time.", "Long work blocks everything, including the U I.", "So the browser runs an event loop, a queue of callbacks processed one after another.", "request Animation Frame loop asks the browser to call your function before the next repaint, typically 60 times a second, and automatically paused when the tab is hidden.", "Your loop had a subtle and instructive structure:", "Scheduling first means the loop survives an exception in the work, the next frame is already queued.", "That sounds robust.", "It is also exactly how bug #14 hid for months: every completed hold threw a Type Error, killed the rest of that one frame, and the loop sailed on.", "No crash, no console noise, no user signal, just a coach quietly doing less than it should.", "The lesson: silent resilience is worse than failure.", "Now the work is wrapped in try over catch that logs every time and shows a banner once per distinct fault. Fail loudly, recover gracefully, a system that hides its own errors cannot be debugged.", "5.3 Asynchrony: promises and callbacks", "Some operations take unknown time, camera permission, loading audio, speech finishing.", "You can't block the single thread waiting.", "Promises represent \"a value that will exist later\": await video.play suspends your function while letting everything else continue.", "Callbacks say \"call this when X happens\": utterance.onend equals....", "Your Coach layers real product logic over these primitives:", "Priority, an urgent cue interrupts encouragement, never the reverse", "T T L (time-to-live), a queued line that's no longer true is discarded rather than spoken late.", "\"Your hips are dropping\" arriving four seconds after they were fixed is worse than silence.", "Watchdog, a timer that force-clears the speaking state, because Chrome's speech synthesis sometimes never fires onend at all.", "Defensive programming against a platform bug you cannot fix.", "5.4 Latency budgets", "From movement to spoken correction:", "Roughly 130-430 milliseconds.", "The engine is a rounding error; audio dominates.", "This is why the Bluetooth measurement is on your task list, it's the biggest single latency contributor and it's invisible until measured.", "Generalisable lesson: optimise what dominates.", "Making the engine twice as fast would be imperceptible.", "Part 6, Architecture and testing", "6.1 Pure functions and side effects", "A pure function: same inputs to same outputs, always, with no effect on anything outside itself. score Target target, value, tier is pure.", "A side effect is anything else, drawing to the screen, playing audio, writing a file, reading the clock.", "Pure functions are dramatically easier to test (call, compare) and to port (no environment to reproduce).", "The strategic move in your architecture:", "**Push side effects to the edges.", "Keep the middle pure.**", "6.2 The effect stream", "The Session had behaviour and side effects tangled together, it computed and touched the dom, the coach and the logger.", "Untestable without a browser.", "The refactor: the core now emits a list of tagged objects describing what should happen, and a thin shell replays them.", "This is a well-known pattern (Elm, Redux, the \"functional core / imperative shell\") and the payoff is immediate and large:", "The core is testable with zero browser", "The shell is too thin to contain a bug", "Effects are data, so they can be recorded, compared and asserted on", "The Swift port needs the core; the platform-specific part is the shell", "It also found two bugs the moment it existed, including one that had hidden behind request Animation Frame for months.", "6.3 Two meanings of \"vector\", the overload that confuses everyone", "You flagged not knowing what a vector is.", "Worth being explicit that this project uses the word in two unrelated senses:", "Mathematical vector (Part 1), a list of numbers treated as a direction.", "Lives in the geometry.", "Test vector / golden vector (this part), a recorded input-and-expected-output pair used to verify an implementation.", "Nothing to do with arrows.", "The name comes from cryptography, where \"test vectors\" have been published for decades.", "Your conformance-vectors.json is the second kind: 1,407 scoring rows, 167 metric readings, 14 full scenarios, all recorded from the running browser engine.", "It's how the Swift port gets verified without me being able to run Swift:", "**The browser engine is the specification.", "The vectors make the specification executable.**", "Fix Swift when a vector fails; never the vector.", "6.4 Determinism", "Deterministic means: same input, same output, every single time.", "Real-time systems fight this constantly, wall clocks, frame rates, random numbers, hash ordering.", "Your engine is deterministic because time enters only as the explicit delta t and now parameters.", "That's what makes a 12-second session reproducible frame-for-frame in a test.", "The frame-rate fix in Part 3 was, at root, a determinism repair: the same physical movement was producing different results depending on hardware speed.", "6.5 Testing strategy", "Your 230 checks across 13 suites are roughly:", "Unit, one function ( score Target across every target times tier). Property, invariants rather than examples (\"the same physical movement scores the same at 24, 30, 60 and 90 F P S\").", "This is how the frame-rate bug is prevented from returning. Integration, whole scenarios through the Evaluator. Regression, a test whose only job is proving a specific fixed bug stays fixed (bug #16 has one). Self-consistency, the generated demo animations must pass the very exercise they demonstrate.", "Elegant, because it makes the content check itself.", "And the one honest gap: the U I shell has zero automated coverage. 230 checks prove the core emits the right effects, not that the screen replays them.", "That's precisely why the desktop smoke test is Phase 1 of your task list.", "6.6 Content as data", "All 21 movements, 5 plans, tier definitions and dialogue are declarative data, not code:", "Consequences that compound:", "Adding a movement means adding data, not writing logic", "The whole content set exports to jay-sahn, so the Swift port hand-transcribes nothing, and transcription is a bug factory", "Content can be audited programmatically.", "Your honesty audit was a script that read the data and computed which targets penalise silently.", "That audit is impossible if the rules are scattered through code.", "Part 7, The pipeline, end to end", "One frame, all the way through:", "Steps 5-12 are pure and headlessly testable.", "Steps 1-4 and 13-14 are the impure edges.", "That line is exactly where the Swift port cuts, which is not a coincidence, it's the whole reason the architecture is shaped this way.", "Glossary", "Activation function, the non-linear squash in a neuron; without it, layers collapse. Aspect ratio, width \u00f7 height.", "Must correct x before measuring angles. Backpropagation, the algorithm computing how each weight affects the error. Bucket index, deriving a sample number from absolute time; immune to drift. C N N, network using sliding shared kernels; the reason vision models are feasible. Confidence, model's self-estimate of reliability; licenses declining to answer. Conformance vector, recorded input/output pair proving two implementations agree. Convolution, sliding a small kernel across an image, dot product at each position. Debounce, rejecting events that happen implausibly fast (your min Ms ). Determinism, same input, same output, every time. Dot product, multiply matching components and sum; measures agreement. delta t (delta time), seconds since the last frame; must appear in every time-based update. E M A, exponential moving average; one-number smoothing filter. Effect stream, describing side effects as data instead of performing them. Event loop, the queue that lets single-threaded JavaScript stay responsive. Gate, a boolean target: position (arming) or quality (clock). Gradient descent, nudging weights downhill along the error surface. Hysteresis, two thresholds plus state memory; kills threshold chatter. Inference, running a trained model (as opposed to training it). Landmark / keypoint, an estimated joint position. Latency budget, the total delay allowance from movement to response. Normalisation, rescaling to a standard range (0 to 1 coordinates; unit vectors). Piecewise linear, straight-line segments; predictable and debuggable. Priming, requiring a genuine rest position before counting reps. Projection, 3D to 2D flattening; irreversibly loses depth information. Pure function, no side effects, no hidden state, trivially testable. Quantisation, lower-precision weights for size and speed. rel-you, max 0, x; the most common activation. Side effect, anything a function changes outside itself. State machine, fixed states with defined transitions; makes bad states unreachable. Time constant, how fast a filter responds, expressed in seconds not frames. Tolerance ( tol ), the dead zone scoring 100; the tier system's main lever. T T L, time-to-live; discard a queued line that's no longer true. Vector (maths), a list of numbers treated as direction and magnitude. Weight (network), a trainable parameter. Weight (scoring), how much a target counts.", "Where to go deeper", "Vectors and geometry, 3Blue1Brown, Essence of Linear Algebra (YouTube).", "The best explanation of dot products that exists, and it's visual throughout.", "Neural networks, 3Blue1Brown's Neural Networks series for intuition; then Andrej Karpathy's *Neural Networks:", "Zero to Hero* if you want to build one from scratch.", "Karpathy's micrograd is ~150 lines and teaches backpropagation properly.", "Pose estimation, the BlazePose paper (Google Research, 2020) is unusually readable, and you'll recognise most of it from Part 2.", "Signal processing, search \"exponential moving average time constant\"; the audio and control-systems literature treats this far more rigorously than the M L world does.", "Architecture, Gary Bernhardt's talk Boundaries is the clearest statement of the functional-core/imperative-shell pattern your engine now uses.", "The most valuable exercise, though: re-read your own Evaluator.evaluate now.", "It's about 80 lines, and every concept in this document appears in it.", "You'll find you can read it line by line, and that's the point."], "sections": [{"title": "Form Coach \u2014 the concepts underneath", "start": 0, "end": 8, "len": 8}, {"title": "Part 1 \u00b7 Numbers in space", "start": 8, "end": 95, "len": 87}, {"title": "Part 2 \u00b7 From light to landmarks", "start": 95, "end": 182, "len": 87}, {"title": "Part 3 \u00b7 Taming a noisy signal", "start": 182, "end": 242, "len": 60}, {"title": "Part 4 \u00b7 From measurements to judgements", "start": 242, "end": 292, "len": 50}, {"title": "Part 5 \u00b7 Time, state and control flow", "start": 292, "end": 335, "len": 43}, {"title": "Part 6 \u00b7 Architecture and testing", "start": 335, "end": 387, "len": 52}, {"title": "Part 7 \u00b7 The pipeline, end to end", "start": 387, "end": 392, "len": 5}, {"title": "Glossary", "start": 392, "end": 395, "len": 3}, {"title": "Where to go deeper", "start": 395, "end": 407, "len": 12}]};
const doc = document.getElementById('doc');

/* ── render ── */
const spanEls = [];
function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function addSpans(host, spans){
  spans.forEach((sp,n) => {
    const s = el('span','s');
    s.innerHTML = sp.html;
    s.dataset.i = sp.i;
    s.tabIndex = 0;
    s.addEventListener('click', () => jump(sp.i, true));
    s.addEventListener('keydown', e => { if(e.key==='Enter') jump(sp.i,true); });
    spanEls[sp.i] = s;
    host.appendChild(s);
    if(n < spans.length-1) host.appendChild(document.createTextNode(' '));
  });
}
let listBuf = null;
for(const b of DATA.blocks){
  if(b.k === 'li'){
    if(!listBuf){ listBuf = el('ul'); listBuf.style.padding='0'; listBuf.style.margin='0 0 1.15em'; doc.appendChild(listBuf); }
    const li = el('li'); addSpans(li, b.spans); listBuf.appendChild(li); continue;
  }
  listBuf = null;
  if(b.k === 'code'){ const p = el('pre'); p.textContent = b.t; doc.appendChild(p); continue; }
  if(b.k === 'hr'){ doc.appendChild(el('hr')); continue; }
  if(b.k === 'table'){
    const t = el('table'), th = el('thead'), tb = el('tbody');
    b.rows.forEach((r,ri) => {
      const tr = el('tr');
      r.forEach(c => { const cell = el(ri===0?'th':'td'); cell.innerHTML = c; tr.appendChild(cell); });
      (ri===0?th:tb).appendChild(tr);
    });
    t.appendChild(th); t.appendChild(tb); doc.appendChild(t); continue;
  }
  const tag = b.k==='quote' ? 'blockquote' : (b.k[0]==='h' ? b.k : 'p');
  const host = el(tag); addSpans(host, b.spans); doc.appendChild(host);
}

/* ── the trace rail ── */
const segs = document.getElementById('segs');
const head = document.getElementById('head');
const segEls = DATA.sections.map((sec, n) => {
  const d = el('div','seg');
  d.style.setProperty('--g', sec.len);
  d.title = sec.title;
  const f = el('div','fill'); d.appendChild(f);
  const num = el('span','num'); num.textContent = String(n).padStart(2,'0'); d.appendChild(num);
  d.addEventListener('click', () => jump(sec.start, true));
  segs.appendChild(d);
  return {d, f, sec};
});

/* ── narration ── */
const synth = window.speechSynthesis;
let idx = 0, playing = false, voices = [], watchdog = null;
const posEl = document.getElementById('pos'), playBtn = document.getElementById('play');
const rateSel = document.getElementById('rate'), voiceSel = document.getElementById('voice');

function loadVoices(){
  voices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if(!voices.length) return;
  const rank = v => (/(samantha|daniel|karen|serena|moira|google uk|google us|natural|premium|enhanced)/i.test(v.name) ? 0 : 1);
  voices.sort((a,b) => rank(a)-rank(b) || a.name.localeCompare(b.name));
  voiceSel.innerHTML = '';
  voices.forEach((v,i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = v.name.replace(/\s*\(.*?\)\s*/g,'').slice(0,26);
    voiceSel.appendChild(o);
  });
}
loadVoices();
if(synth) synth.onvoiceschanged = loadVoices;

function paint(){
  spanEls.forEach((s,i) => { if(!s) return;
    s.classList.toggle('live', i===idx && playing);
    s.classList.toggle('done', i<idx);
  });
  posEl.innerHTML = '<b>'+(idx+1)+'</b>/'+DATA.queue.length;
  let active = 0;
  segEls.forEach((s,n) => {
    const done = Math.min(1, Math.max(0, (idx - s.sec.start) / s.sec.len));
    s.f.style.width = (done*100)+'%';
    const on = idx >= s.sec.start && idx < s.sec.end;
    s.d.classList.toggle('on', on);
    if(on) active = n;
  });
  const s = segEls[active];
  if(s){
    const r = s.d.getBoundingClientRect(), rail = document.getElementById('rail').getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (idx - s.sec.start)/s.sec.len));
    head.style.display = 'block';
    head.style.top = (r.top - rail.top + r.height*frac) + 'px';
  }
  save();
}

function scrollTo(i){
  const s = spanEls[i]; if(!s) return;
  const r = s.getBoundingClientRect();
  const want = window.innerHeight * 0.34;
  if(Math.abs(r.top - want) > window.innerHeight * 0.28 || r.top < 70 || r.bottom > window.innerHeight - 90){
    window.scrollBy({ top: r.top - want, behavior: 'smooth' });
  }
}

function speakNow(){
  if(!playing || idx >= DATA.queue.length){ stop(); return; }
  const text = DATA.queue[idx];
  const u = new SpeechSynthesisUtterance(text);
  const v = voices[+voiceSel.value];
  if(v) { u.voice = v; u.lang = v.lang; }
  u.rate = parseFloat(rateSel.value);
  u.pitch = 1;
  u.onend = () => { if(!playing) return; idx++; paint(); if(idx<DATA.queue.length){ scrollTo(idx); speakNow(); } else stop(); };
  u.onerror = u.onend;
  /* Watchdog — same lesson as the app's Coach: some engines never fire onend.
     Estimate a generous duration and move on rather than hanging forever. */
  clearTimeout(watchdog);
  const secs = (text.split(/\s+/).length / (2.6 * u.rate)) + 3.5;
  watchdog = setTimeout(() => { if(playing){ synth.cancel(); idx++; paint(); scrollTo(idx); speakNow(); } }, secs*1000);
  synth.cancel();
  synth.speak(u);
  paint(); scrollTo(idx);
}
function start(){ if(!synth){ alert('This browser has no speech synthesis.'); return; }
  playing = true; playBtn.textContent = '❚❚ Pause'; speakNow(); }
function stop(){ playing = false; clearTimeout(watchdog); synth.cancel();
  playBtn.textContent = '▶ Listen'; paint(); }
function jump(i, autoplay){
  idx = Math.max(0, Math.min(DATA.queue.length-1, i));
  if(playing || autoplay){ playing = true; playBtn.textContent='❚❚ Pause'; speakNow(); }
  else { paint(); scrollTo(idx); }
}

playBtn.onclick = () => playing ? stop() : start();
document.getElementById('prev').onclick = () => jump(idx-1, false);
document.getElementById('next').onclick = () => jump(idx+1, false);
rateSel.onchange = () => { if(playing) speakNow(); save(); };
voiceSel.onchange = () => { if(playing) speakNow(); save(); };

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT') return;
  if(e.code === 'Space'){ e.preventDefault(); playing ? stop() : start(); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); jump(idx+1, false); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); jump(idx-1, false); }
});
window.addEventListener('beforeunload', () => synth && synth.cancel());

/* ── remember where you got to (degrades silently if unavailable) ── */
async function save(){
  try{ await window.storage.set('reader:pos', JSON.stringify(
    {i: idx, rate: rateSel.value, voice: voiceSel.value})); }catch(e){}
}
(async () => {
  try{
    const r = await window.storage.get('reader:pos');
    if(r && r.value){
      const st = JSON.parse(r.value);
      if(st.rate) rateSel.value = st.rate;
      if(st.voice && voiceSel.options.length > st.voice) voiceSel.value = st.voice;
      if(st.i > 0){
        idx = Math.min(st.i, DATA.queue.length-1);
        paint();
        setTimeout(() => spanEls[idx] && spanEls[idx].scrollIntoView({block:'center'}), 60);
        return;
      }
    }
  }catch(e){}
  paint();
})();
</script>
</body>
</html>
