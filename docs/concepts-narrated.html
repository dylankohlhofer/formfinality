<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form Coach — the concepts underneath · narrated</title>
<style>
:root{
  --paper:#EDEFEA;        /* cool graph-paper */
  --paper-2:#E4E7E0;
  --ink:#15191B;
  --ink-2:#5C666A;
  --ink-3:#8E9793;
  --teal:#1F5E5A;         /* structure, rules, playhead */
  --teal-2:#2F817B;
  --amber:#F0C24B;        /* the live sentence — the only warm thing here */
  --amber-deep:#B8860B;
  --rule:#CDD2C9;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --serif:"Charter","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --rail:88px;
  --bar:64px;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#141817; --paper-2:#1B201E; --ink:#E8EBE6; --ink-2:#9AA49F; --ink-3:#6E7873;
         --teal:#6FD8C9; --teal-2:#4FB5A8; --rule:#2A312E; --amber:#F0C24B; --amber-deep:#F0C24B; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:19px; line-height:1.62;
  -webkit-font-smoothing:antialiased; padding-bottom:var(--bar);
}
body::before{ /* faint graph paper */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:28px 28px; mask-image:radial-gradient(ellipse at 30% 0%,#000 10%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 30% 0%,#000 10%,transparent 72%);
}

/* ── the trace rail: the document as a signal ── */
#rail{
  position:fixed; left:0; top:0; bottom:var(--bar); width:var(--rail);
  padding:22px 0 22px 0; z-index:5;
  border-right:1px solid var(--rule); background:var(--paper);
  display:flex; flex-direction:column; gap:3px; align-items:stretch;
}
.seg{
  position:relative; flex:var(--g) 1 0; margin:0 14px 0 20px; cursor:pointer;
  border-radius:2px; background:var(--paper-2); overflow:hidden;
  border:1px solid var(--rule); transition:background .18s;
}
.seg:hover{ background:var(--rule) }
.seg .fill{ position:absolute; inset:0 auto 0 0; width:0%; background:var(--teal); opacity:.85 }
.seg .num{
  position:absolute; left:-16px; top:0; font-family:var(--mono); font-size:9.5px;
  color:var(--ink-3); letter-spacing:.04em;
}
.seg.on{ border-color:var(--teal) }
.seg.on .num{ color:var(--teal); font-weight:700 }
#head{ position:absolute; left:14px; right:8px; height:2px; background:var(--amber-deep);
  box-shadow:0 0 0 1px var(--paper); transition:top .25s ease; z-index:6; display:none }
#head::after{ content:""; position:absolute; right:-3px; top:-3px; width:8px; height:8px;
  background:var(--amber-deep); border-radius:50% }
#railcap{ font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--ink-3);
  text-align:center; text-transform:uppercase; padding-bottom:8px }

/* ── reading column ── */
main{ position:relative; z-index:1; max-width:37em; margin:0 auto; padding:72px 26px 40vh 26px }
@media(min-width:900px){ main{ margin-left:calc(var(--rail) + 5vw); margin-right:auto } }

h1,h2,h3{ font-family:var(--mono); font-weight:600; line-height:1.28; margin:0 }
h1{ font-size:15px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal);
    margin:4.2em 0 1.1em; padding-bottom:.7em; border-bottom:2px solid var(--teal) }
h1:first-of-type{ margin-top:0 }
h2{ font-size:13.5px; letter-spacing:.055em; margin:2.9em 0 .85em; color:var(--ink) }
h2::before{ content:"▚ "; color:var(--amber-deep) }
h3{ font-size:12.5px; letter-spacing:.05em; margin:2.2em 0 .7em; color:var(--ink-2) }
p{ margin:0 0 1.15em }
li{ margin:0 0 .62em 1.15em; list-style:none; position:relative }
li::before{ content:"—"; position:absolute; left:-1.15em; color:var(--ink-3) }
blockquote{
  margin:1.7em 0; padding:.95em 1.2em; border-left:3px solid var(--amber-deep);
  background:var(--paper-2); font-size:.97em;
}
code{ font-family:var(--mono); font-size:.83em; background:var(--paper-2);
  padding:.12em .34em; border-radius:3px; border:1px solid var(--rule) }
pre{ font-family:var(--mono); font-size:12.5px; line-height:1.55; background:var(--paper-2);
  border:1px solid var(--rule); border-left:3px solid var(--ink-3); padding:1em 1.1em;
  overflow-x:auto; margin:1.5em 0; color:var(--ink-2) }
pre::before{ content:"not narrated"; display:block; font-size:8.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:.7em }
table{ border-collapse:collapse; width:100%; margin:1.6em 0; font-family:var(--mono); font-size:12px }
th,td{ border:1px solid var(--rule); padding:.5em .6em; text-align:left; vertical-align:top }
thead th{ background:var(--paper-2); font-weight:600 }
hr{ border:0; border-top:1px solid var(--rule); margin:3em 0 }
strong{ font-weight:700 }

/* ── the live sentence: a real highlighter ── */
.s{ cursor:pointer; border-radius:2px; transition:background .12s, box-shadow .12s }
.s:hover{ background:color-mix(in srgb,var(--amber) 22%,transparent) }
.s.live{
  background:linear-gradient(180deg,transparent 6%,var(--amber) 6%,var(--amber) 92%,transparent 92%);
  box-shadow:0 0 0 2px var(--amber); color:#15191B;
}
.s.done{ color:var(--ink-2) }
h1 .s.live,h2 .s.live,h3 .s.live{ box-shadow:none; background:var(--amber); color:#15191B }

/* ── control bar ── */
#bar{
  position:fixed; left:0; right:0; bottom:0; height:var(--bar); z-index:20;
  background:var(--paper); border-top:1px solid var(--rule);
  display:flex; align-items:center; gap:10px; padding:0 14px;
  padding-bottom:env(safe-area-inset-bottom); font-family:var(--mono); font-size:11px;
}
button{ font-family:var(--mono); font-size:11.5px; color:var(--ink); background:var(--paper-2);
  border:1px solid var(--rule); border-radius:4px; padding:.55em .7em; cursor:pointer;
  letter-spacing:.03em; transition:background .15s,border-color .15s }
button:hover{ background:var(--rule) }
button:focus-visible,select:focus-visible,.s:focus-visible{ outline:2px solid var(--teal); outline-offset:2px }
#play{ background:var(--teal); color:var(--paper); border-color:var(--teal); min-width:82px; font-weight:600 }
#play:hover{ background:var(--teal-2); border-color:var(--teal-2) }
select{ font-family:var(--mono); font-size:11px; background:var(--paper-2); color:var(--ink);
  border:1px solid var(--rule); border-radius:4px; padding:.5em .4em; max-width:150px }
#pos{ margin-left:auto; color:var(--ink-2); letter-spacing:.06em; white-space:nowrap; text-align:right }
#pos b{ color:var(--teal); font-weight:600 }
.hint{ color:var(--ink-3); font-size:10px; letter-spacing:.05em }
@media(max-width:899px){
  :root{ --rail:0px }
  #rail{ display:none }
  body{ font-size:17.5px }
  main{ padding-top:52px }
  .hint,#vlabel{ display:none }
  select{ max-width:96px }
}
@media(prefers-reduced-motion:reduce){ *{ transition:none !important; scroll-behavior:auto !important } }
</style>
</head>
<body>

<nav id="rail" aria-label="Document progress">
  <div id="railcap">trace</div>
  <div id="segs" style="flex:1;display:flex;flex-direction:column;gap:3px"></div>
  <div id="head"></div>
</nav>

<main id="doc"></main>

<div id="bar">
  <button id="play" aria-label="Play or pause narration">▶ Listen</button>
  <button id="prev" aria-label="Previous sentence">◀</button>
  <button id="next" aria-label="Next sentence">▶</button>
  <select id="rate" aria-label="Speed">
    <option value="0.8">0.8×</option><option value="0.9">0.9×</option>
    <option value="1" selected>1.0×</option><option value="1.1">1.1×</option>
    <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
  </select>
  <span id="vlabel" class="hint">voice</span>
  <select id="voice" aria-label="Voice"></select>
  <span class="hint" id="tip">space = play · ← → = sentence</span>
  <span id="pos"><b>0</b>/0</span>
</div>

<script>
const DATA = {"blocks": [{"k": "h1", "spans": [{"i": 0, "html": "Form Coach \u2014 the concepts underneath"}]}, {"k": "p", "spans": [{"i": 1, "html": "<strong>What this is:</strong> every computing and machine-learning idea your system is built from, explained from zero, in the order the data actually flows."}, {"i": 2, "html": "No prior knowledge assumed \u2014 Part 1 starts with what a number in space means."}]}, {"k": "p", "spans": [{"i": 3, "html": "<strong>How to read it:</strong> one part per sitting."}, {"i": 4, "html": "Each concept follows the same shape:"}]}, {"k": "quote", "spans": [{"i": 5, "html": "<strong>The idea</strong> \u2192 <strong>the maths, only where it earns its place</strong> \u2192 <strong>where it lives in your code</strong> \u2192 <strong>what went wrong when we got it wrong.</strong>"}]}, {"k": "p", "spans": [{"i": 6, "html": "That last one matters most."}, {"i": 7, "html": "Every bug this project has hit was a fundamental principle biting back, and a bug you&#x27;ve personally watched happen is worth ten pages of theory."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 8, "html": "Part 1 \u00b7 Numbers in space"}]}, {"k": "h2", "spans": [{"i": 9, "html": "1.1 A point is two numbers"}]}, {"k": "p", "spans": [{"i": 10, "html": "Your camera sees a rectangle."}, {"i": 11, "html": "To say <em>where</em> something is inside that rectangle, you need two numbers: how far across, and how far down."}]}, {"k": "code", "t": "(0,0) \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 (1,0)\n      \u2502                 \u2502\n      \u2502      \u2022 (0.5, 0.3)\n      \u2502                 \u2502\n(0,1) \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 (1,1)"}, {"k": "p", "spans": [{"i": 12, "html": "Two conventions worth burning in, because both bite people:"}]}, {"k": "p", "spans": [{"i": 13, "html": "<strong>We use 0\u21921, not pixels.</strong> A shoulder at <code>x: 0.5</code> is halfway across the frame <em>whatever the resolution</em>."}, {"i": 14, "html": "This is called <strong>normalising</strong>, and it means the same code works on a 720p laptop webcam and a 4K phone."}, {"i": 15, "html": "Your <code>Joint</code> type is exactly this: <code>{x, y, c}</code>."}]}, {"k": "p", "spans": [{"i": 16, "html": "<strong>y increases DOWNWARDS.</strong> Screen coordinates inherit this from how old monitors drew scanlines \u2014 top to bottom."}, {"i": 17, "html": "So a hip <em>lower</em> in the frame has a <em>bigger</em> y."}, {"i": 18, "html": "Every time you read a threshold in the content and it feels upside down, this is why."}]}, {"k": "h2", "spans": [{"i": 19, "html": "1.2 A vector is a point used as an arrow"}]}, {"k": "p", "spans": [{"i": 20, "html": "You said you don&#x27;t know what a vector is."}, {"i": 21, "html": "Here it is, and it&#x27;s genuinely this simple:"}]}, {"k": "p", "spans": [{"i": 22, "html": "<strong>A vector is a list of numbers.</strong> That&#x27;s the whole definition. <code>[3, 4]</code> is a vector."}]}, {"k": "p", "spans": [{"i": 23, "html": "What makes it <em>useful</em> is that we agree to interpret it as <strong>a direction and a distance</strong> rather than a location."}, {"i": 24, "html": "The point <code>(3, 4)</code> means <em>&quot;here&quot;</em>."}, {"i": 25, "html": "The vector <code>[3, 4]</code> means <em>&quot;3 across and 4 down from wherever you currently are&quot;</em> \u2014 an arrow, not a pin."}]}, {"k": "p", "spans": [{"i": 26, "html": "<strong>Why the distinction earns its keep:</strong> joint positions are points, but everything you want to <em>know</em> is about relationships between them."}, {"i": 27, "html": "&quot;Is the arm straight?&quot; isn&#x27;t a question about where the elbow is; it&#x27;s about the direction from elbow to shoulder versus the direction from elbow to wrist."}, {"i": 28, "html": "Directions are vectors."}]}, {"k": "p", "spans": [{"i": 29, "html": "<strong>Making a vector from two points \u2014 subtract:</strong>"}]}, {"k": "code", "t": "vector from A to B = [B.x - A.x, B.y - A.y]"}, {"k": "p", "spans": [{"i": 30, "html": "Your <code>angleAt</code> function does exactly this in its first line:"}]}, {"k": "code", "t": "const v1 = {x: a.x - b.x, y: a.y - b.y};   // from vertex b, toward a\nconst v2 = {x: c.x - b.x, y: c.y - b.y};   // from vertex b, toward c"}, {"k": "p", "spans": [{"i": 31, "html": "Two arrows, both starting at the joint you care about."}]}, {"k": "p", "spans": [{"i": 32, "html": "<strong>Length of a vector \u2014 Pythagoras:</strong>"}]}, {"k": "code", "t": "length([3, 4]) = \u221a(3\u00b2 + 4\u00b2) = \u221a25 = 5"}, {"k": "p", "spans": [{"i": 33, "html": "In code that&#x27;s <code>Math.hypot(x, y)</code>."}, {"i": 34, "html": "It&#x27;s Pythagoras&#x27; theorem doing its only job."}]}, {"k": "h2", "spans": [{"i": 35, "html": "1.3 The dot product, and why it gives you angles"}]}, {"k": "p", "spans": [{"i": 36, "html": "This is the one piece of real maths in your geometry layer, so it&#x27;s worth understanding rather than trusting."}]}, {"k": "p", "spans": [{"i": 37, "html": "<strong>The operation:</strong> multiply matching components, add the results."}]}, {"k": "code", "t": "[a, b] \u00b7 [c, d] = a\u00d7c + b\u00d7d"}, {"k": "p", "spans": [{"i": 38, "html": "<strong>What it means:</strong> the dot product measures <strong>how much two vectors agree</strong>."}]}, {"k": "li", "spans": [{"i": 39, "html": "Pointing the same way \u2192 large positive number"}]}, {"k": "li", "spans": [{"i": 40, "html": "At right angles \u2192 exactly <strong>zero</strong>"}]}, {"k": "li", "spans": [{"i": 41, "html": "Pointing opposite ways \u2192 large negative number"}]}, {"k": "p", "spans": [{"i": 42, "html": "That zero-at-right-angles property is not a coincidence; it&#x27;s the definition doing its work, and it&#x27;s why the dot product turns up everywhere in graphics and physics."}]}, {"k": "p", "spans": [{"i": 43, "html": "<strong>Getting the actual angle.</strong> The dot product also equals:"}]}, {"k": "code", "t": "v1 \u00b7 v2 = |v1| \u00d7 |v2| \u00d7 cos(\u03b8)"}, {"k": "p", "spans": [{"i": 44, "html": "where <code>|v|</code> is length and <code>\u03b8</code> is the angle between them."}, {"i": 45, "html": "Rearranged:"}]}, {"k": "code", "t": "cos(\u03b8) = (v1 \u00b7 v2) / (|v1| \u00d7 |v2|)\n\u03b8 = arccos( that )"}, {"k": "p", "spans": [{"i": 46, "html": "Dividing by the lengths is called <strong>normalising</strong> \u2014 it strips out &quot;how long are these arrows&quot; and leaves only &quot;how much do they agree&quot;, which is what an angle is."}, {"i": 47, "html": "This is why your angle measurements don&#x27;t care whether someone is close to the camera or far away."}]}, {"k": "p", "spans": [{"i": 48, "html": "<strong>Your actual code, now fully readable:</strong>"}]}, {"k": "code", "t": "const dot = v1.x*v2.x + v1.y*v2.y;                    // agreement\nconst mag = Math.hypot(v1.x,v1.y) * Math.hypot(v2.x,v2.y);   // lengths multiplied\nif (mag &lt; 1e-9) return null;                          // degenerate: joints coincide\nreturn Math.acos(clamp(dot/mag, -1, 1)) * 180/Math.PI;"}, {"k": "p", "spans": [{"i": 49, "html": "Two defensive details worth noticing, because both are real-world lessons:"}]}, {"k": "p", "spans": [{"i": 50, "html": "<strong>The <code>1e-9</code> guard.</strong> If two landmarks land on exactly the same spot, a vector has zero length, and you&#x27;d divide by zero \u2014 which in JavaScript gives <code>NaN</code> (&quot;not a number&quot;), a value that silently poisons every calculation it touches."}, {"i": 51, "html": "Returning <code>null</code> instead makes the failure honest and visible."}]}, {"k": "p", "spans": [{"i": 52, "html": "<strong>The clamp to [-1, 1].</strong> <code>arccos</code> is only defined on that range."}, {"i": 53, "html": "Floating-point arithmetic can produce <code>1.0000000000000002</code>, and <code>arccos</code> of that is <code>NaN</code>."}, {"i": 54, "html": "Clamping costs nothing and prevents a whole class of mystery bug."}]}, {"k": "p", "spans": [{"i": 55, "html": "<strong>Radians vs degrees.</strong> Computers do trigonometry in <strong>radians</strong> (a full circle is 2\u03c0 \u2248 6.28)."}, {"i": 56, "html": "Humans think in degrees (360). <code>\u00d7 180/Math.PI</code> converts."}, {"i": 57, "html": "Your content is written in degrees because <em>you</em> have to read it."}]}, {"k": "h2", "spans": [{"i": 58, "html": "1.4 Projection: what a flat image throws away"}]}, {"k": "p", "spans": [{"i": 59, "html": "A camera takes a 3D world and flattens it to 2D."}, {"i": 60, "html": "That flattening is called <strong>projection</strong>, and it is <strong>lossy</strong> \u2014 information is destroyed and cannot be recovered."}]}, {"k": "p", "spans": [{"i": 61, "html": "Specifically: <strong>motion along the camera&#x27;s viewing direction becomes invisible.</strong>"}]}, {"k": "p", "spans": [{"i": 62, "html": "This isn&#x27;t a limitation of your code, your model, or your phone."}, {"i": 63, "html": "It&#x27;s geometry."}, {"i": 64, "html": "It is the single most important constraint in your entire product, and it&#x27;s the reason for the principle you landed on independently:"}]}, {"k": "quote", "spans": [{"i": 65, "html": "**Only correct what you can measure."}, {"i": 66, "html": "Teach what you cannot.**"}]}, {"k": "p", "spans": [{"i": 67, "html": "Concretely, from your honesty audit:"}]}, {"k": "li", "spans": [{"i": 68, "html": "Side-on, a squat&#x27;s <strong>depth</strong> is beautifully visible (it happens across the image)"}]}, {"k": "li", "spans": [{"i": 69, "html": "Side-on, a squat&#x27;s <strong>knee valgus</strong> \u2014 knees caving inward \u2014 is nearly invisible (it happens along the viewing direction)"}]}, {"k": "p", "spans": [{"i": 70, "html": "Two consequences you&#x27;ve already built:"}]}, {"k": "p", "spans": [{"i": 71, "html": "<strong><code>sideness</code></strong> estimates how side-on the body is."}, {"i": 72, "html": "Below 25\u00b0 the coach stops making claims and asks the person to turn; between 25\u00b0 and 50\u00b0 it suppresses depth-dependent cues while keeping the ones that survive the angle."}, {"i": 73, "html": "That&#x27;s the engine reasoning about its own projection loss."}]}, {"k": "p", "spans": [{"i": 74, "html": "<strong><code>cat-cow</code> is <code>guided</code></strong> \u2014 it makes no judgements at all, because per-segment spinal articulation cannot be seen from one camera."}, {"i": 75, "html": "That movement is the reference standard for intellectual honesty in the whole system."}]}, {"k": "h2", "spans": [{"i": 76, "html": "1.5 Aspect ratio: the bug that geometry made inevitable"}]}, {"k": "p", "spans": [{"i": 77, "html": "Here&#x27;s where normalised coordinates bite back, and it&#x27;s worth walking through because it&#x27;s subtle and you shipped it."}]}, {"k": "p", "spans": [{"i": 78, "html": "Normalising x and y <strong>independently</strong> to 0\u21921 means one unit of x and one unit of y are <em>not the same physical distance</em> unless the frame is square."}]}, {"k": "p", "spans": [{"i": 79, "html": "On a 1920\u00d71080 frame (16:9), moving 0.1 in x is 192 pixels; moving 0.1 in y is 108 pixels."}, {"i": 80, "html": "So a 45\u00b0 angle in the real world measures as something else entirely in normalised space."}, {"i": 81, "html": "The image is stretched, and every angle is stretched with it."}]}, {"k": "p", "spans": [{"i": 82, "html": "<strong>The fix</strong>, in your <code>readMetric</code>:"}]}, {"k": "code", "t": "const A = frame.aspect;                 // image width / height\nangleAt({x: b.x*A, y: b.y}, {x: a.x*A, y: a.y}, {x: c.x*A, y: c.y})"}, {"k": "p", "spans": [{"i": 83, "html": "Multiplying x by the aspect ratio restores physical proportions before any angle is computed."}, {"i": 84, "html": "Same shape, same measurement, portrait or landscape."}]}, {"k": "p", "spans": [{"i": 85, "html": "<strong>The lesson:</strong> normalisation is a convenience, and every convenience quietly encodes an assumption."}, {"i": 86, "html": "This one assumed square pixels in a square frame."}]}, {"k": "h2", "spans": [{"i": 87, "html": "1.6 Point-to-line distance: the <code>line</code> metric"}]}, {"k": "p", "spans": [{"i": 88, "html": "Your other geometric measure answers &quot;is this joint sitting on the line between these two other joints?&quot; \u2014 which is exactly &quot;is the body straight?&quot;"}]}, {"k": "p", "spans": [{"i": 89, "html": "The method: figure out how far along the shoulder\u2192ankle line the hip sits horizontally (call that fraction <code>u</code>), work out where the hip <em>would</em> be at that fraction if the body were perfectly straight, and subtract."}]}, {"k": "code", "t": "const u = (o.x - f.x) / (t.x - f.x);          // how far along, 0\u21921\nreturn o.y - (f.y + u*(t.y - f.y));           // actual y minus expected y"}, {"k": "p", "spans": [{"i": 90, "html": "The result is <strong>signed</strong>, which is why it can distinguish sag from pike where an angle cannot \u2014 positive one way, negative the other."}, {"i": 91, "html": "That&#x27;s why <code>hipAlign</code> can say two different things and <code>bodyLine</code> (an angle) can only say &quot;not straight&quot;."}]}, {"k": "p", "spans": [{"i": 92, "html": "<strong>And the guard that mattered:</strong>"}]}, {"k": "code", "t": "if (Math.abs(dx) &lt; 0.05) return 0;"}, {"k": "p", "spans": [{"i": 93, "html": "If the two reference joints are vertically stacked \u2014 shoulder directly above ankle, i.e. a standing person \u2014 then <code>dx \u2248 0</code> and <code>u</code> explodes toward infinity."}, {"i": 94, "html": "When I added grading to <code>wall-push-up</code> I had to use an <strong>angle</strong> rather than a line for exactly this reason: a standing body has no horizontal extent, so the line metric would have returned a constant 0 and silently graded everyone perfect."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 95, "html": "Part 2 \u00b7 From light to landmarks"}]}, {"k": "h2", "spans": [{"i": 96, "html": "2.1 What a video frame actually is"}]}, {"k": "p", "spans": [{"i": 97, "html": "A digital image is a grid of <strong>pixels</strong>, each storing brightness for red, green and blue \u2014 typically 0\u2013255 each, one byte apiece."}, {"i": 98, "html": "A 1920\u00d71080 frame is about 2 million pixels, ~6 MB raw."}]}, {"k": "p", "spans": [{"i": 99, "html": "<strong>Video is just many of these per second.</strong> 30 fps means a new 6 MB grid every 33 milliseconds."}, {"i": 100, "html": "Nothing in the image says &quot;shoulder&quot;."}, {"i": 101, "html": "It&#x27;s a wall of numbers, and something has to find meaning in it."}]}, {"k": "h2", "spans": [{"i": 102, "html": "2.2 Why this needs machine learning"}]}, {"k": "p", "spans": [{"i": 103, "html": "Could you write rules?"}, {"i": 104, "html": "&quot;Skin-coloured pixels near the top are probably a head.&quot; People have tried for decades."}, {"i": 105, "html": "It fails immediately on: different skin tones, clothing, lighting, backgrounds, occlusion, unusual poses, camera angles."}]}, {"k": "p", "spans": [{"i": 106, "html": "The reason is that the mapping from <em>pixels</em> to <em>&quot;where is the shoulder&quot;</em> is enormously complicated and nobody can write it down."}, {"i": 107, "html": "That is precisely the situation machine learning exists for:"}]}, {"k": "quote", "spans": [{"i": 108, "html": "<strong>Instead of writing the rules, show the computer millions of examples and let it find a function that fits them.</strong>"}]}, {"k": "h2", "spans": [{"i": 109, "html": "2.3 Neural networks, honestly"}]}, {"k": "p", "spans": [{"i": 110, "html": "A neural network is a big mathematical function with adjustable numbers inside, called <strong>parameters</strong> or <strong>weights</strong>."}]}, {"k": "p", "spans": [{"i": 111, "html": "<strong>One neuron:</strong> take several inputs, multiply each by a weight, add them up, add a <strong>bias</strong>, then apply a simple non-linear squash (an <strong>activation function</strong>)."}]}, {"k": "code", "t": "output = squash( w\u2081x\u2081 + w\u2082x\u2082 + \u2026 + b )"}, {"k": "p", "spans": [{"i": 112, "html": "The multiply-and-add part is a <strong>dot product</strong> \u2014 the same operation from \u00a71.3, doing a completely different job."}, {"i": 113, "html": "That&#x27;s not a coincidence:"}, {"i": 114, "html": "&quot;weighted combination of inputs&quot; is one of the most reusable ideas in all of computing."}]}, {"k": "p", "spans": [{"i": 115, "html": "<strong>The squash matters enormously.</strong> Without it, stacking layers achieves nothing \u2014 a chain of linear operations collapses into a single linear operation, and you&#x27;re back to drawing straight lines."}, {"i": 116, "html": "The non-linearity is what lets networks represent curves, corners and conditions."}, {"i": 117, "html": "The common choice, <strong>ReLU</strong>, is almost insultingly simple: <code>max(0, x)</code>."}, {"i": 118, "html": "Negative becomes zero, positive passes through."}]}, {"k": "p", "spans": [{"i": 119, "html": "<strong>A network</strong> is these neurons in layers: inputs \u2192 hidden layers \u2192 outputs."}, {"i": 120, "html": "&quot;Deep learning&quot; just means many layers."}]}, {"k": "p", "spans": [{"i": 121, "html": "<strong>Training</strong> is the interesting part:"}]}, {"k": "li", "spans": [{"i": 122, "html": "Show it an image where you know the true joint positions (<strong>labelled training data</strong>)"}]}, {"k": "li", "spans": [{"i": 123, "html": "It predicts; you measure how wrong it is (<strong>loss function</strong>)"}]}, {"k": "li", "spans": [{"i": 124, "html": "Work out, for every single weight, which direction would reduce the error (<strong>backpropagation</strong> \u2014 the chain rule from calculus, applied at scale)"}]}, {"k": "li", "spans": [{"i": 125, "html": "Nudge all the weights slightly that way (<strong>gradient descent</strong>)"}]}, {"k": "li", "spans": [{"i": 126, "html": "Repeat millions of times"}]}, {"k": "p", "spans": [{"i": 127, "html": "The result is a function that generalises to images it&#x27;s never seen \u2014 <em>provided</em> they resemble the training data."}, {"i": 128, "html": "Which is exactly why your app should tell people not to wear baggy trousers: loose fabric moving independently of the leg is unlike the training data, so the estimate degrades. <strong>That backlog item is an ML constraint wearing a UX costume.</strong>"}]}, {"k": "h2", "spans": [{"i": 129, "html": "2.4 Convolution: the idea that makes vision work"}]}, {"k": "p", "spans": [{"i": 130, "html": "A crucial detail: you can&#x27;t just wire every pixel to every neuron. 2 million inputs \u00d7 a hidden layer of 1000 = 2 billion weights in the first layer alone."}, {"i": 131, "html": "Untrainable and absurd."}]}, {"k": "p", "spans": [{"i": 132, "html": "<strong>Convolutional Neural Networks (CNNs)</strong> exploit two facts about images:"}]}, {"k": "p", "spans": [{"i": 133, "html": "<strong>Locality</strong> \u2014 a shoulder is a <em>local</em> arrangement of pixels."}, {"i": 134, "html": "You don&#x27;t need the top-left corner to identify something in the bottom-right."}]}, {"k": "p", "spans": [{"i": 135, "html": "<strong>Translation invariance</strong> \u2014 a shoulder looks like a shoulder wherever it appears."}, {"i": 136, "html": "The same detector should work everywhere."}]}, {"k": "p", "spans": [{"i": 137, "html": "So instead of per-pixel weights, you learn a small <strong>kernel</strong> \u2014 say 3\u00d73 \u2014 and slide it across the whole image, computing a dot product at every position."}, {"i": 138, "html": "That&#x27;s a <strong>convolution</strong>."}, {"i": 139, "html": "Nine weights, reused across two million pixels."}]}, {"k": "p", "spans": [{"i": 140, "html": "Stack these, and something remarkable emerges: early layers learn edges, later ones learn corners and textures, later still learn body parts, and the deepest learn whole configurations."}, {"i": 141, "html": "Nobody programmed that hierarchy \u2014 it falls out of training."}]}, {"k": "h2", "spans": [{"i": 142, "html": "2.5 How pose models output joint positions"}]}, {"k": "p", "spans": [{"i": 143, "html": "Two approaches, and the distinction explains a real property of your system."}]}, {"k": "p", "spans": [{"i": 144, "html": "<strong>Heatmap regression.</strong> The network outputs, per joint, a grid where each cell holds &quot;how likely is this joint here&quot;."}, {"i": 145, "html": "You take the peak."}, {"i": 146, "html": "Accurate, and naturally gives you a confidence value \u2014 but you need a full grid per joint, which is expensive."}]}, {"k": "p", "spans": [{"i": 147, "html": "<strong>Direct regression.</strong> The network just outputs numbers: x, y for each joint."}, {"i": 148, "html": "Much faster, usually slightly less accurate."}]}, {"k": "p", "spans": [{"i": 149, "html": "<strong>BlazePose \u2014 what MediaPipe uses \u2014 is a hybrid</strong>, and cleverly so: it trains <em>with</em> a heatmap branch to get the accuracy benefit, then <strong>throws that branch away for inference</strong> and keeps only the regression head."}, {"i": 150, "html": "You pay the heatmap cost during training, once, and get the speed at runtime, forever."}]}, {"k": "p", "spans": [{"i": 151, "html": "It also uses a <strong>two-stage pipeline</strong>:"}]}, {"k": "li", "spans": [{"i": 152, "html": "A lightweight <strong>detector</strong> finds the person and a rough crop"}]}, {"k": "li", "spans": [{"i": 153, "html": "A <strong>landmark model</strong> runs on that crop and produces the joints"}]}, {"k": "p", "spans": [{"i": 154, "html": "And critically, on subsequent frames it <strong>skips the detector</strong> and reuses the previous frame&#x27;s region \u2014 because bodies don&#x27;t teleport."}, {"i": 155, "html": "This is called <strong>tracking</strong>, and it&#x27;s most of why real-time pose estimation is feasible on a phone at all."}]}, {"k": "p", "spans": [{"i": 156, "html": "Consequence you can observe: when tracking is lost (you leave the frame), recovery takes noticeably longer than a normal frame, because the detector has to run again."}, {"i": 157, "html": "Your <code>vis</code> cue (&quot;I can&#x27;t see you&quot;) exists for exactly this window."}]}, {"k": "h2", "spans": [{"i": 158, "html": "2.6 The 33 landmarks, confidence, and the z-coordinate"}]}, {"k": "p", "spans": [{"i": 159, "html": "BlazePose emits 33 landmarks: face points, shoulders, elbows, wrists, hands, hips, knees, ankles, heels, toes."}, {"i": 160, "html": "Your engine names a subset \u2014 <code>shoulder</code>, <code>hip</code>, <code>knee</code>, <code>ankle</code>, <code>heel</code>, <code>toe</code>, <code>ear</code>, <code>elbow</code>, <code>wrist</code> \u2014 because those are the ones your movements need."}]}, {"k": "p", "spans": [{"i": 161, "html": "<strong>Confidence (<code>c</code> in your <code>Joint</code>)</strong> is the model&#x27;s own estimate of reliability, 0\u21921."}, {"i": 162, "html": "Your engine gates on it:"}]}, {"k": "code", "t": "if (frame.conf &lt; 0.5) { out.ok = false; return out; }"}, {"k": "p", "spans": [{"i": 163, "html": "This is a small idea with a big payoff: <strong>a model that reports its own uncertainty lets you decline to answer.</strong> A coach that says &quot;I can&#x27;t see you properly&quot; is infinitely better than one that confidently corrects a shape it hasn&#x27;t actually seen."}]}, {"k": "p", "spans": [{"i": 164, "html": "<strong>The z-coordinate</strong> deserves scepticism."}, {"i": 165, "html": "BlazePose does emit depth, estimated via a synthetic 3D human model (GHUM) during training."}, {"i": 166, "html": "But it&#x27;s <em>inferred from a single 2D image</em>, not measured, so it&#x27;s far less reliable than x and y."}]}, {"k": "p", "spans": [{"i": 167, "html": "Your architecture treats it appropriately: z feeds <code>sideness</code> \u2014 a coarse &quot;how side-on is this person&quot; judgement \u2014 and nothing else."}, {"i": 168, "html": "Coarse question, coarse-but-adequate signal."}, {"i": 169, "html": "If you ever tried to measure knee valgus in degrees from z, you&#x27;d be building on sand."}, {"i": 170, "html": "This is also the crux of the any-angle question in your backlog, and why that experiment needs a hard validation gate (\u22644\u00b0) before anything depends on it."}]}, {"k": "h2", "spans": [{"i": 171, "html": "2.7 Why this runs on the phone at all"}]}, {"k": "p", "spans": [{"i": 172, "html": "Three things make on-device inference practical, and they&#x27;re worth knowing because they&#x27;re the technical foundation of your entire business model:"}]}, {"k": "p", "spans": [{"i": 173, "html": "<strong>Small models.</strong> BlazePose Lite is a few megabytes."}, {"i": 174, "html": "Compare a large language model at tens of gigabytes."}]}, {"k": "p", "spans": [{"i": 175, "html": "<strong>Quantisation.</strong> Weights are stored at reduced precision \u2014 8-bit integers instead of 32-bit floats."}, {"i": 176, "html": "Four times smaller, substantially faster, negligible accuracy loss for this task."}]}, {"k": "p", "spans": [{"i": 177, "html": "<strong>Hardware acceleration.</strong> Phones have GPUs and dedicated neural accelerators (Apple&#x27;s Neural Engine)."}, {"i": 178, "html": "MediaPipe dispatches to them automatically."}]}, {"k": "p", "spans": [{"i": 179, "html": "Net result: ~10 ms per frame on a modern phone, well inside a 33 ms budget at 30 fps."}]}, {"k": "p", "spans": [{"i": 180, "html": "<strong>And this is why &quot;zero running costs, \u00a34.99 once&quot; is possible.</strong> Not a pricing trick \u2014 a direct consequence of the inference happening on hardware the user already owns and paid for."}, {"i": 181, "html": "Your competitors&#x27; subscriptions largely fund servers you don&#x27;t need."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 182, "html": "Part 3 \u00b7 Taming a noisy signal"}]}, {"k": "h2", "spans": [{"i": 183, "html": "3.1 Every measurement is wrong"}]}, {"k": "p", "spans": [{"i": 184, "html": "Point a pose model at a perfectly still person and the landmarks still jitter \u2014 a degree or two, frame to frame."}, {"i": 185, "html": "Sources: sensor noise, compression artefacts, lighting flicker, and the model itself being a continuous function fed slightly different pixels each frame."}]}, {"k": "p", "spans": [{"i": 186, "html": "Left raw, this makes a coach unusable: the score flickers, cues fire and unfire, reps double-count."}, {"i": 187, "html": "Cleaning up noisy measurements is <strong>signal processing</strong>, and it&#x27;s most of what separates a demo from a product."}]}, {"k": "h2", "spans": [{"i": 188, "html": "3.2 The exponential moving average"}]}, {"k": "p", "spans": [{"i": 189, "html": "The workhorse."}, {"i": 190, "html": "Each frame, move your stored estimate a fraction of the way toward the new reading:"}]}, {"k": "code", "t": "estimate = estimate + \u03b1 \u00d7 (measurement \u2212 estimate)"}, {"k": "p", "spans": [{"i": 191, "html": "<code>\u03b1</code> (alpha) between 0 and 1 controls responsiveness:"}]}, {"k": "li", "spans": [{"i": 192, "html": "<code>\u03b1 = 1</code> \u2192 estimate <em>is</em> the measurement (no smoothing)"}]}, {"k": "li", "spans": [{"i": 193, "html": "<code>\u03b1 = 0.35</code> \u2192 moves a third of the way each frame (your per-target default)"}]}, {"k": "li", "spans": [{"i": 194, "html": "<code>\u03b1 = 0.1</code> \u2192 slow and stable (your form score)"}]}, {"k": "li", "spans": [{"i": 195, "html": "<code>\u03b1 = 0.02</code> \u2192 glacial (your rep baseline drift)"}]}, {"k": "p", "spans": [{"i": 196, "html": "It&#x27;s called <em>exponential</em> because the influence of any old reading decays exponentially \u2014 each frame multiplies its remaining weight by <code>(1\u2212\u03b1)</code>."}, {"i": 197, "html": "Every past measurement contributes something, but recent ones dominate."}, {"i": 198, "html": "Beautifully, it needs <strong>one stored number</strong> rather than a history buffer, which is why it&#x27;s everywhere in embedded and real-time systems."}]}, {"k": "p", "spans": [{"i": 199, "html": "<strong>The engineering trade-off is unavoidable:</strong> more smoothing = less noise but more lag."}, {"i": 200, "html": "Your score uses <code>\u03b1 = 0.1</code> because a form score should feel stable; your target readings use 0.35 because a cue must arrive while the fault is still happening. <em>Late coaching is wrong coaching.</em>"}]}, {"k": "h2", "spans": [{"i": 201, "html": "3.3 The frame-rate trap \u2014 a fundamental error we shipped"}]}, {"k": "p", "spans": [{"i": 202, "html": "Here&#x27;s the deepest lesson in this document."}]}, {"k": "p", "spans": [{"i": 203, "html": "The formula above advances <strong>once per frame</strong>."}, {"i": 204, "html": "So the amount of smoothing depends on <strong>how many frames happen</strong>, not how much <em>time</em> passes."}, {"i": 205, "html": "At 60 fps you get twice as many updates per second as at 30 fps \u2014 so the same filter converges twice as fast."}]}, {"k": "p", "spans": [{"i": 206, "html": "Your thresholds were tuned in a browser at a steady 30 fps."}, {"i": 207, "html": "On a phone, frame rate varies with device, thermal state and capture pipeline."}, {"i": 208, "html": "Measured on the same physical movement, the score filter read:"}]}, {"k": "table", "rows": [["", "24 fps", "30 fps", "60 fps", "90 fps"], ["value 0.5 s into a 100\u21920 change", "28.2", "20.6", "4.2", "0.9"]]}, {"k": "p", "spans": [{"i": 209, "html": "The filter ran <strong>3.74\u00d7 faster at 90 fps than at 24 fps</strong>."}, {"i": 210, "html": "Every constant downstream \u2014 the praise window, the early-stop threshold, cue timing \u2014 silently inherited that error."}]}, {"k": "p", "spans": [{"i": 211, "html": "<strong>The fix \u2014 think in time, not frames.</strong> Express the filter as a <strong>time constant</strong> and convert per frame using the actual elapsed time <code>dt</code>:"}]}, {"k": "code", "t": "const REF_DT = 1/30;\nemaAlpha(\u03b1, dt) = 1 \u2212 (1\u2212\u03b1)^(dt / REF_DT)"}, {"k": "p", "spans": [{"i": 212, "html": "Read it as: <em>&quot;what single step is equivalent to <code>dt/REF_DT</code> steps of the old filter?&quot;</em> At exactly 30 fps it returns \u03b1 unchanged \u2014 which is why every existing test and vector still passed, proving it a pure generalisation rather than a behaviour change."}]}, {"k": "p", "spans": [{"i": 213, "html": "<strong>The principle, and it applies far beyond this project:</strong>"}]}, {"k": "quote", "spans": [{"i": 214, "html": "<strong>Anything that evolves over time should be a function of elapsed time, never of how many times your code happened to run.</strong>"}]}, {"k": "p", "spans": [{"i": 215, "html": "Related concept: <strong><code>dt</code> (delta time)</strong> is the interval since the last frame, and it should appear in every physics-like calculation."}, {"i": 216, "html": "Your hold clock (<code>hold += dt</code>) was already correct; the filters weren&#x27;t."}]}, {"k": "p", "spans": [{"i": 217, "html": "A second-order version of the same bug appeared minutes later."}, {"i": 218, "html": "The score trace sampled every 6 <em>frames</em> \u2014 twice as dense at 60 fps, skewing the fatigue-vs-technique classifier."}, {"i": 219, "html": "Switching to a clock check then drifted through <strong>floating-point accumulation</strong> (adding 1/30 repeatedly never lands exactly on 0.2), giving 53 samples at 30 fps versus 58 at 60."}, {"i": 220, "html": "The final fix computes a <strong>bucket index</strong> \u2014 <code>floor(elapsed / 0.2)</code> \u2014 which is exact at any rate."}, {"i": 221, "html": "Lesson: <em>derive from an absolute quantity rather than accumulating increments.</em>"}]}, {"k": "h2", "spans": [{"i": 222, "html": "3.4 Hysteresis: two thresholds, not one"}]}, {"k": "p", "spans": [{"i": 223, "html": "Counting reps by asking &quot;is the hip angle above 162\u00b0?&quot; fails immediately."}, {"i": 224, "html": "When someone hovers near the threshold, noise flips the answer every frame and you count twenty reps in a second."}]}, {"k": "p", "spans": [{"i": 225, "html": "<strong>Hysteresis</strong> uses two thresholds with a gap between them, plus a memory of which state you&#x27;re in:"}]}, {"k": "code", "t": "upAbove: 162,     // must exceed this to become &quot;up&quot;\ndownBelow: 140,   // must drop below this to become &quot;down&quot;"}, {"k": "p", "spans": [{"i": 226, "html": "Between 140 and 162 nothing changes \u2014 you stay wherever you were."}, {"i": 227, "html": "Noise would have to swing 22\u00b0 to cause a false count."}, {"i": 228, "html": "Your thermostat works the same way, for the same reason."}]}, {"k": "h2", "spans": [{"i": 229, "html": "3.5 Debouncing, and the two ways a rep can fail"}]}, {"k": "p", "spans": [{"i": 230, "html": "Hysteresis handles <em>noise</em>."}, {"i": 231, "html": "It doesn&#x27;t handle a person genuinely bouncing through half-repetitions using momentum."}, {"i": 232, "html": "That needs a <strong>time</strong> test \u2014 a <strong>debounce</strong>:"}]}, {"k": "code", "t": "minMs: 1200    // a rep completed faster than this isn&#x27;t a controlled rep"}, {"k": "p", "spans": [{"i": 233, "html": "This was declared in your content since v4 and <strong>never read</strong> until v4.8 \u2014 dead configuration that read as implemented."}, {"i": 234, "html": "Now enforced, scaled by tier (Strong 0.6\u00d7, because a trained body legitimately moves faster)."}]}, {"k": "p", "spans": [{"i": 235, "html": "The design decision that matters more than the mechanism: <strong>rejected reps are never silent.</strong> The coach says <em>&quot;slower \u2014 control it, and I&#x27;ll count it.&quot;</em> A rep the person definitely performed vanishing without explanation reads as a broken app."}]}, {"k": "p", "spans": [{"i": 236, "html": "And its counterpart, added in the same release: <strong>short-range detection.</strong> Progress toward the threshold is tracked as a fraction (0 at rest, 1 at the threshold); leaving rest, reaching 40\u201399%, and returning without crossing means an attempted rep that didn&#x27;t make it \u2192 <em>&quot;go a bit deeper.&quot;</em> Below 40% is ignored, so shifting position isn&#x27;t nagged at."}]}, {"k": "p", "spans": [{"i": 237, "html": "<strong>Why this couldn&#x27;t be a per-frame check</strong> \u2014 and this is the conceptual heart of it:"}]}, {"k": "p", "spans": [{"i": 238, "html": "A rep driver is graded against a <em>fixed ideal pose</em>. <code>squat.kneeBend</code> has ideal 175\u00b0 (legs straight) but the rep requires going below 110\u00b0."}, {"i": 239, "html": "A per-frame cue would therefore fire at the <strong>bottom of every good rep</strong>."}, {"i": 240, "html": "Which is precisely the bug we found shipped in <code>glute-bridge</code> \u2014 the app said <em>&quot;Higher \u2014 squeeze at the top!&quot;</em> while the user was correctly at the bottom of the movement."}]}, {"k": "quote", "spans": [{"i": 241, "html": "<strong>A shortfall is a property of the whole cycle, not of any single frame.</strong> Choosing the right <em>unit of analysis</em> \u2014 frame, cycle, set, session \u2014 is a design decision, and getting it wrong produces confident nonsense."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 242, "html": "Part 4 \u00b7 From measurements to judgements"}]}, {"k": "h2", "spans": [{"i": 243, "html": "4.1 Scoring: continuous, with a forgiving core"}]}, {"k": "p", "spans": [{"i": 244, "html": "Given a measured angle, how good is it?"}, {"i": 245, "html": "Your <code>scoreTarget</code>:"}]}, {"k": "code", "t": "const err = Math.abs(v \u2212 t.ideal);\nif (err &lt;= tol) return 100;                        // dead zone: perfect\nreturn Math.max(0, 100 \u00d7 (1 \u2212 (err \u2212 tol)/(range \u2212 tol)));   // linear falloff"}, {"k": "p", "spans": [{"i": 246, "html": "Three deliberate design choices, each worth naming:"}]}, {"k": "p", "spans": [{"i": 247, "html": "<strong>The dead zone (<code>tol</code>).</strong> Inside tolerance, everything scores 100."}, {"i": 248, "html": "Without it, the score would twitch constantly and nobody is <em>exactly</em> at 180\u00b0."}, {"i": 249, "html": "This is the numerical expression of &quot;good enough is good enough&quot; \u2014 and it&#x27;s why the whole system feels kind rather than pedantic."}]}, {"k": "p", "spans": [{"i": 250, "html": "<strong>Linear falloff, not a cliff.</strong> Beyond tolerance the score degrades smoothly."}, {"i": 251, "html": "Small errors cost a little, big errors cost a lot."}, {"i": 252, "html": "A step function would make the coach feel arbitrary."}]}, {"k": "p", "spans": [{"i": 253, "html": "<strong>Clamped at zero.</strong> Terrible is terrible; there&#x27;s no negative."}]}, {"k": "p", "spans": [{"i": 254, "html": "This shape \u2014 <strong>piecewise linear</strong> \u2014 is a common and underrated choice."}, {"i": 255, "html": "It&#x27;s trivial to reason about, trivial to debug, and behaves predictably at the edges, where clever curves tend to surprise you."}]}, {"k": "p", "spans": [{"i": 256, "html": "<strong>Tolerance is the tier system&#x27;s main lever:</strong> the same <code>tol</code> is multiplied by 1.9 for Learning, 1.25 for Building, 1.0 for Strong."}, {"i": 257, "html": "One number, applied consistently, expresses &quot;be gentler with beginners&quot; across all 21 movements without duplicating any content."}]}, {"k": "h2", "spans": [{"i": 258, "html": "4.2 Booleans and continuous values are different tools"}]}, {"k": "p", "spans": [{"i": 259, "html": "Your targets do two distinct jobs, and keeping them distinct is what makes the engine coherent:"}]}, {"k": "p", "spans": [{"i": 260, "html": "<strong>Gates</strong> answer yes/no. <code>pos: true</code> decides <em>is this person even in the position</em> (should the set start?). <code>gate: true</code> decides <em>is this good enough to count as holding it</em> (should the clock run?)."}]}, {"k": "p", "spans": [{"i": 261, "html": "<strong>Graded targets</strong> answer how-well, feeding the weighted score."}]}, {"k": "p", "spans": [{"i": 262, "html": "The split matters because they have different failure modes."}, {"i": 263, "html": "A gate being slightly wrong stops the session; a graded target being slightly wrong nudges a number."}, {"i": 264, "html": "Conflating them \u2014 &quot;if the score drops below 50, stop the clock&quot; \u2014 makes both jobs worse."}]}, {"k": "h2", "spans": [{"i": 265, "html": "4.3 Weighted averages, and a nasty edge case"}]}, {"k": "p", "spans": [{"i": 266, "html": "Combining several target scores into one number:"}]}, {"k": "code", "t": "score = \u03a3(score\u1d62 \u00d7 weight\u1d62) / \u03a3(weight\u1d62)"}, {"k": "p", "spans": [{"i": 267, "html": "Weight expresses <em>what actually matters for this movement</em>."}, {"i": 268, "html": "In a plank, <code>hipAlign</code> carries <code>w: 2</code> while other targets carry 1 \u2014 because a plank essentially <em>is</em> the straightness of the body."}]}, {"k": "p", "spans": [{"i": 269, "html": "<strong>The edge case:</strong> <code>w: 0</code> means &quot;measure this, but don&#x27;t grade it&quot; \u2014 used for rep drivers, where the driver&#x27;s instantaneous value is about counting, not quality."}, {"i": 270, "html": "But if <em>every</em> target in a movement has <code>w: 0</code>, the denominator is zero and you compute <code>0/0 = NaN</code> \u2014 which propagates silently through every subsequent calculation and poisons the display."}]}, {"k": "p", "spans": [{"i": 271, "html": "Your engine handles it with a fallback chain: graded targets \u2192 else quality gates \u2192 else all readings."}, {"i": 272, "html": "Defensive, and the alternative is a form score reading &quot;NaN&quot; to a beginner."}]}, {"k": "h2", "spans": [{"i": 273, "html": "4.4 Choosing what to say: selection under constraints"}]}, {"k": "p", "spans": [{"i": 274, "html": "A beginner receiving four corrections at once will do none of them."}, {"i": 275, "html": "This is a real cognitive constraint, not a UI preference, and your engine encodes it in three layers:"}]}, {"k": "p", "spans": [{"i": 276, "html": "<strong>Worst-offender selection.</strong> Sort the failing targets by score, take the lowest."}, {"i": 277, "html": "One cue, the most important one."}]}, {"k": "p", "spans": [{"i": 278, "html": "<strong>Cue budget.</strong> Learning tier allows <strong>one distinct cue per set</strong>."}, {"i": 279, "html": "Building allows two."}, {"i": 280, "html": "Strong is effectively uncapped."}, {"i": 281, "html": "Once the budget is spent, other faults are noted for the debrief rather than voiced."}]}, {"k": "p", "spans": [{"i": 282, "html": "<strong>Cooldown.</strong> Even the same cue won&#x27;t repeat within 9 s (Learning) / 6 s / 4 s."}, {"i": 283, "html": "Silence is a feature \u2014 it gives someone time to actually attempt the correction."}]}, {"k": "p", "spans": [{"i": 284, "html": "A subtle implementation note with a real lesson:"}, {"i": 285, "html": "JavaScript&#x27;s <code>Array.sort</code> is <strong>stable</strong> (equal elements keep their original order); Swift&#x27;s is <strong>not guaranteed</strong> to be."}, {"i": 286, "html": "So the Swift port sorts by <code>(score, index)</code> explicitly."}, {"i": 287, "html": "Two ties broken differently would mean the two implementations say different things on the same input \u2014 an invisible divergence that no casual test would catch."}]}, {"k": "h2", "spans": [{"i": 288, "html": "4.5 Suppression: knowing when not to speak"}]}, {"k": "p", "spans": [{"i": 289, "html": "When <code>sideness</code> says the view is oblique (25\u201350\u00b0), depth-dependent cues are dropped rather than voiced \u2014 they&#x27;d be measuring an artefact of the angle, not the body."}, {"i": 290, "html": "They&#x27;re logged as <code>view\u2298cue</code> so the telemetry shows <em>what would have been said and why it wasn&#x27;t</em>."}]}, {"k": "p", "spans": [{"i": 291, "html": "That logging choice is worth stealing generally: <strong>record your suppressed decisions.</strong> A system that silently declines to act is very hard to debug otherwise."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 292, "html": "Part 5 \u00b7 Time, state and control flow"}]}, {"k": "h2", "spans": [{"i": 293, "html": "5.1 State machines"}]}, {"k": "p", "spans": [{"i": 294, "html": "A <strong>state machine</strong> is a system that is always in exactly one of a fixed set of states, with defined rules for moving between them."}, {"i": 295, "html": "It&#x27;s one of the most useful concepts in all of programming, and your system has three."}]}, {"k": "p", "spans": [{"i": 296, "html": "<strong>The rep counter:</strong> <code>down</code> \u21c4 <code>up</code>, with hysteresis thresholds as the transition rules, plus a <code>primed</code> flag."}, {"i": 297, "html": "That flag exists because a plank and a bridge lockout are <em>geometrically identical</em> \u2014 so nothing counts until a genuine resting position has been observed first."}, {"i": 298, "html": "Without it, walking into position counts as a rep."}]}, {"k": "p", "spans": [{"i": 299, "html": "<strong>The session:</strong> <code>setup</code> \u2192 <code>active</code> \u2192 (rest) \u2192 next step."}, {"i": 300, "html": "The <code>setup \u2192 active</code> transition (&quot;arming&quot;) requires <em>both</em> that the person has been in position for 1.2 s <em>and</em> that the coach has stopped talking."}, {"i": 301, "html": "That second condition is a product decision \u2014 never start the clock while someone is still listening to the instructions."}]}, {"k": "p", "spans": [{"i": 302, "html": "<strong>Speech:</strong> idle \u21c4 speaking, with a priority queue underneath."}]}, {"k": "p", "spans": [{"i": 303, "html": "<strong>Why the pattern earns its place:</strong> it makes illegal states unreachable."}, {"i": 304, "html": "&quot;Counting reps before the set started&quot; isn&#x27;t a bug you have to remember to prevent \u2014 it&#x27;s a transition that doesn&#x27;t exist."}]}, {"k": "h2", "spans": [{"i": 305, "html": "5.2 The event loop and <code>requestAnimationFrame</code>"}]}, {"k": "p", "spans": [{"i": 306, "html": "JavaScript is <strong>single-threaded</strong>: one thing at a time."}, {"i": 307, "html": "Long work blocks everything, including the UI."}, {"i": 308, "html": "So the browser runs an <strong>event loop</strong> \u2014 a queue of callbacks processed one after another."}]}, {"k": "p", "spans": [{"i": 309, "html": "<code>requestAnimationFrame(loop)</code> asks the browser to call your function before the next repaint \u2014 typically 60 times a second, and automatically paused when the tab is hidden."}]}, {"k": "p", "spans": [{"i": 310, "html": "<strong>Your loop had a subtle and instructive structure:</strong>"}]}, {"k": "code", "t": "function loop(t){\n  if (!running) return;\n  requestAnimationFrame(loop);   // \u2190 scheduled BEFORE the work\n  ...work...\n}"}, {"k": "p", "spans": [{"i": 311, "html": "Scheduling first means the loop survives an exception in the work \u2014 the next frame is already queued."}, {"i": 312, "html": "That sounds robust."}, {"i": 313, "html": "It is also <strong>exactly how bug #14 hid for months</strong>: every completed hold threw a <code>TypeError</code>, killed the rest of that one frame, and the loop sailed on."}, {"i": 314, "html": "No crash, no console noise, no user signal \u2014 just a coach quietly doing less than it should."}]}, {"k": "p", "spans": [{"i": 315, "html": "<strong>The lesson:</strong> silent resilience is worse than failure."}, {"i": 316, "html": "Now the work is wrapped in <code>try/catch</code> that logs every time and shows a banner once per distinct fault. <strong>Fail loudly, recover gracefully</strong> \u2014 a system that hides its own errors cannot be debugged."}]}, {"k": "h2", "spans": [{"i": 317, "html": "5.3 Asynchrony: promises and callbacks"}]}, {"k": "p", "spans": [{"i": 318, "html": "Some operations take unknown time \u2014 camera permission, loading audio, speech finishing."}, {"i": 319, "html": "You can&#x27;t block the single thread waiting."}]}, {"k": "p", "spans": [{"i": 320, "html": "<strong>Promises</strong> represent &quot;a value that will exist later&quot;: <code>await video.play()</code> suspends <em>your function</em> while letting everything else continue."}]}, {"k": "p", "spans": [{"i": 321, "html": "<strong>Callbacks</strong> say &quot;call this when X happens&quot;: <code>utterance.onend = \u2026</code>."}]}, {"k": "p", "spans": [{"i": 322, "html": "Your <code>Coach</code> layers real product logic over these primitives:"}]}, {"k": "li", "spans": [{"i": 323, "html": "<strong>Priority</strong> \u2014 an urgent cue interrupts encouragement, never the reverse"}]}, {"k": "li", "spans": [{"i": 324, "html": "<strong>TTL (time-to-live)</strong> \u2014 a queued line that&#x27;s no longer true is <em>discarded</em> rather than spoken late."}, {"i": 325, "html": "&quot;Your hips are dropping&quot; arriving four seconds after they were fixed is worse than silence."}]}, {"k": "li", "spans": [{"i": 326, "html": "<strong>Watchdog</strong> \u2014 a timer that force-clears the speaking state, because Chrome&#x27;s speech synthesis sometimes never fires <code>onend</code> at all."}, {"i": 327, "html": "Defensive programming against a platform bug you cannot fix."}]}, {"k": "h2", "spans": [{"i": 328, "html": "5.4 Latency budgets"}]}, {"k": "p", "spans": [{"i": 329, "html": "From movement to spoken correction:"}]}, {"k": "code", "t": "capture ~16ms \u2192 inference ~10ms \u2192 engine &lt;1ms \u2192 speech start ~100\u2013200ms\n                                                \u2192 Bluetooth +150\u2013200ms"}, {"k": "p", "spans": [{"i": 330, "html": "Roughly 130\u2013430 ms."}, {"i": 331, "html": "The engine is a rounding error; <strong>audio dominates</strong>."}, {"i": 332, "html": "This is why the Bluetooth measurement is on your task list \u2014 it&#x27;s the biggest single latency contributor and it&#x27;s invisible until measured."}]}, {"k": "p", "spans": [{"i": 333, "html": "<strong>Generalisable lesson:</strong> optimise what dominates."}, {"i": 334, "html": "Making the engine twice as fast would be imperceptible."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 335, "html": "Part 6 \u00b7 Architecture and testing"}]}, {"k": "h2", "spans": [{"i": 336, "html": "6.1 Pure functions and side effects"}]}, {"k": "p", "spans": [{"i": 337, "html": "A <strong>pure function</strong>: same inputs \u2192 same outputs, always, with no effect on anything outside itself. <code>scoreTarget(target, value, tier)</code> is pure."}]}, {"k": "p", "spans": [{"i": 338, "html": "A <strong>side effect</strong> is anything else \u2014 drawing to the screen, playing audio, writing a file, reading the clock."}]}, {"k": "p", "spans": [{"i": 339, "html": "Pure functions are dramatically easier to test (call, compare) and to port (no environment to reproduce)."}, {"i": 340, "html": "The strategic move in your architecture:"}]}, {"k": "quote", "spans": [{"i": 341, "html": "**Push side effects to the edges."}, {"i": 342, "html": "Keep the middle pure.**"}]}, {"k": "h2", "spans": [{"i": 343, "html": "6.2 The effect stream"}]}, {"k": "p", "spans": [{"i": 344, "html": "The Session had behaviour and side effects tangled together \u2014 it computed <em>and</em> touched the DOM, the coach and the logger."}, {"i": 345, "html": "Untestable without a browser."}]}, {"k": "p", "spans": [{"i": 346, "html": "The refactor: the core now <strong>emits a list of tagged objects</strong> describing what should happen, and a thin shell replays them."}]}, {"k": "code", "t": "{t:&quot;say&quot;, key:&quot;sag&quot;, pri:2}\n{t:&quot;bigTime&quot;, secs:12.4}\n{t:&quot;log&quot;, row:{\u2026}}"}, {"k": "p", "spans": [{"i": 347, "html": "This is a well-known pattern (Elm, Redux, the &quot;functional core / imperative shell&quot;) and the payoff is immediate and large:"}]}, {"k": "li", "spans": [{"i": 348, "html": "The core is testable with zero browser"}]}, {"k": "li", "spans": [{"i": 349, "html": "The shell is too thin to contain a bug"}]}, {"k": "li", "spans": [{"i": 350, "html": "<strong>Effects are data, so they can be recorded, compared and asserted on</strong>"}]}, {"k": "li", "spans": [{"i": 351, "html": "The Swift port needs the core; the platform-specific part is the shell"}]}, {"k": "p", "spans": [{"i": 352, "html": "It also found two bugs the moment it existed, including one that had hidden behind <code>requestAnimationFrame</code> for months."}]}, {"k": "h2", "spans": [{"i": 353, "html": "6.3 Two meanings of &quot;vector&quot; \u2014 the overload that confuses everyone"}]}, {"k": "p", "spans": [{"i": 354, "html": "You flagged not knowing what a vector is."}, {"i": 355, "html": "Worth being explicit that this project uses the word in <strong>two unrelated senses</strong>:"}]}, {"k": "p", "spans": [{"i": 356, "html": "<strong>Mathematical vector</strong> (Part 1) \u2014 a list of numbers treated as a direction."}, {"i": 357, "html": "Lives in the geometry."}]}, {"k": "p", "spans": [{"i": 358, "html": "<strong>Test vector / golden vector</strong> (this part) \u2014 a recorded input-and-expected-output pair used to verify an implementation."}, {"i": 359, "html": "Nothing to do with arrows."}, {"i": 360, "html": "The name comes from cryptography, where &quot;test vectors&quot; have been published for decades."}]}, {"k": "p", "spans": [{"i": 361, "html": "Your <code>conformance-vectors.json</code> is the second kind: 1,407 scoring rows, 167 metric readings, 14 full scenarios, all recorded from the <em>running</em> browser engine."}, {"i": 362, "html": "It&#x27;s how the Swift port gets verified without me being able to run Swift:"}]}, {"k": "quote", "spans": [{"i": 363, "html": "**The browser engine is the specification."}, {"i": 364, "html": "The vectors make the specification executable.**"}]}, {"k": "p", "spans": [{"i": 365, "html": "Fix Swift when a vector fails; never the vector."}]}, {"k": "h2", "spans": [{"i": 366, "html": "6.4 Determinism"}]}, {"k": "p", "spans": [{"i": 367, "html": "<strong>Deterministic</strong> means: same input, same output, every single time."}]}, {"k": "p", "spans": [{"i": 368, "html": "Real-time systems fight this constantly \u2014 wall clocks, frame rates, random numbers, hash ordering."}, {"i": 369, "html": "Your engine is deterministic because time enters <em>only</em> as the explicit <code>dt</code> and <code>now</code> parameters."}, {"i": 370, "html": "That&#x27;s what makes a 12-second session reproducible frame-for-frame in a test."}]}, {"k": "p", "spans": [{"i": 371, "html": "The frame-rate fix in Part 3 was, at root, a determinism repair: the same physical movement was producing different results depending on hardware speed."}]}, {"k": "h2", "spans": [{"i": 372, "html": "6.5 Testing strategy"}]}, {"k": "p", "spans": [{"i": 373, "html": "Your 230 checks across 13 suites are roughly:"}]}, {"k": "p", "spans": [{"i": 374, "html": "<strong>Unit</strong> \u2014 one function (<code>scoreTarget</code> across every target \u00d7 tier). <strong>Property</strong> \u2014 invariants rather than examples (&quot;the same physical movement scores the same at 24, 30, 60 and 90 fps&quot;)."}, {"i": 375, "html": "This is how the frame-rate bug is prevented from returning. <strong>Integration</strong> \u2014 whole scenarios through the Evaluator. <strong>Regression</strong> \u2014 a test whose only job is proving a specific fixed bug stays fixed (bug #16 has one). <strong>Self-consistency</strong> \u2014 the generated demo animations must pass the very exercise they demonstrate."}, {"i": 376, "html": "Elegant, because it makes the content check <em>itself</em>."}]}, {"k": "p", "spans": [{"i": 377, "html": "<strong>And the one honest gap:</strong> the UI shell has <strong>zero</strong> automated coverage. 230 checks prove the core emits the right effects, not that the screen replays them."}, {"i": 378, "html": "That&#x27;s precisely why the desktop smoke test is Phase 1 of your task list."}]}, {"k": "h2", "spans": [{"i": 379, "html": "6.6 Content as data"}]}, {"k": "p", "spans": [{"i": 380, "html": "All 21 movements, 5 plans, tier definitions and dialogue are <strong>declarative data</strong>, not code:"}]}, {"k": "code", "t": "{id:&quot;hipAlign&quot;, m:{k:&quot;line&quot;, of:&quot;hip&quot;, from:&quot;shoulder&quot;, to:&quot;ankle&quot;},\n ideal:0, tol:0.035, range:0.11, w:2, above:&quot;pike&quot;, below:&quot;sag&quot;}"}, {"k": "p", "spans": [{"i": 381, "html": "Consequences that compound:"}]}, {"k": "li", "spans": [{"i": 382, "html": "Adding a movement means adding data, not writing logic"}]}, {"k": "li", "spans": [{"i": 383, "html": "The whole content set exports to JSON, so <strong>the Swift port hand-transcribes nothing</strong> \u2014 and transcription is a bug factory"}]}, {"k": "li", "spans": [{"i": 384, "html": "Content can be audited programmatically."}, {"i": 385, "html": "Your honesty audit was a <em>script</em> that read the data and computed which targets penalise silently."}, {"i": 386, "html": "That audit is impossible if the rules are scattered through code."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 387, "html": "Part 7 \u00b7 The pipeline, end to end"}]}, {"k": "p", "spans": [{"i": 388, "html": "One frame, all the way through:"}]}, {"k": "code", "t": "1. CAMERA          getUserMedia \u2192 a video element\n2. FRAME           30\u201360 per second, ~2M pixels each\n3. INFERENCE       BlazePose CNN \u2192 33 landmarks + confidences   (~10 ms)\n4. FRAME BUILD     landmarks \u2192 {left, right, cam, conf, aspect, sideness}\n5. METRICS         readMetric per target \u2014 angles, line deviations   (\u00a71)\n6. SMOOTHING       dt-normalised EMA per target                      (\u00a73)\n7. SCORING         scoreTarget \u2192 0\u2013100 per target                    (\u00a74)\n8. GATES           pos \u2192 arming?   gate \u2192 clock running?\n9. VIEW            sideness \u2192 block, or suppress depth cues\n10. REP MACHINE    hysteresis + priming + tempo + range              (\u00a73, \u00a75)\n11. SELECTION      worst offender, under budget and cooldown         (\u00a74)\n12. EFFECTS        emit tagged effect list                           (\u00a76)\n13. SHELL          replay \u2192 screen, speech, telemetry\n14. SPEECH         priority queue, TTL, interruption                 (\u00a75)"}, {"k": "p", "spans": [{"i": 389, "html": "Steps 5\u201312 are pure and headlessly testable."}, {"i": 390, "html": "Steps 1\u20134 and 13\u201314 are the impure edges."}, {"i": 391, "html": "That line is exactly where the Swift port cuts \u2014 which is not a coincidence, it&#x27;s the whole reason the architecture is shaped this way."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 392, "html": "Glossary"}]}, {"k": "p", "spans": [{"i": 393, "html": "<strong>Activation function</strong> \u2014 the non-linear squash in a neuron; without it, layers collapse. <strong>Aspect ratio</strong> \u2014 width \u00f7 height."}, {"i": 394, "html": "Must correct x before measuring angles. <strong>Backpropagation</strong> \u2014 the algorithm computing how each weight affects the error. <strong>Bucket index</strong> \u2014 deriving a sample number from absolute time; immune to drift. <strong>CNN</strong> \u2014 network using sliding shared kernels; the reason vision models are feasible. <strong>Confidence</strong> \u2014 model&#x27;s self-estimate of reliability; licenses declining to answer. <strong>Conformance vector</strong> \u2014 recorded input/output pair proving two implementations agree. <strong>Convolution</strong> \u2014 sliding a small kernel across an image, dot product at each position. <strong>Debounce</strong> \u2014 rejecting events that happen implausibly fast (your <code>minMs</code>). <strong>Determinism</strong> \u2014 same input, same output, every time. <strong>Dot product</strong> \u2014 multiply matching components and sum; measures agreement. <strong>dt (delta time)</strong> \u2014 seconds since the last frame; must appear in every time-based update. <strong>EMA</strong> \u2014 exponential moving average; one-number smoothing filter. <strong>Effect stream</strong> \u2014 describing side effects as data instead of performing them. <strong>Event loop</strong> \u2014 the queue that lets single-threaded JS stay responsive. <strong>Gate</strong> \u2014 a boolean target: position (arming) or quality (clock). <strong>Gradient descent</strong> \u2014 nudging weights downhill along the error surface. <strong>Hysteresis</strong> \u2014 two thresholds plus state memory; kills threshold chatter. <strong>Inference</strong> \u2014 running a trained model (as opposed to training it). <strong>Landmark / keypoint</strong> \u2014 an estimated joint position. <strong>Latency budget</strong> \u2014 the total delay allowance from movement to response. <strong>Normalisation</strong> \u2014 rescaling to a standard range (0\u21921 coordinates; unit vectors). <strong>Piecewise linear</strong> \u2014 straight-line segments; predictable and debuggable. <strong>Priming</strong> \u2014 requiring a genuine rest position before counting reps. <strong>Projection</strong> \u2014 3D \u2192 2D flattening; irreversibly loses depth information. <strong>Pure function</strong> \u2014 no side effects, no hidden state, trivially testable. <strong>Quantisation</strong> \u2014 lower-precision weights for size and speed. <strong>ReLU</strong> \u2014 <code>max(0, x)</code>; the most common activation. <strong>Side effect</strong> \u2014 anything a function changes outside itself. <strong>State machine</strong> \u2014 fixed states with defined transitions; makes bad states unreachable. <strong>Time constant</strong> \u2014 how fast a filter responds, expressed in seconds not frames. <strong>Tolerance (<code>tol</code>)</strong> \u2014 the dead zone scoring 100; the tier system&#x27;s main lever. <strong>TTL</strong> \u2014 time-to-live; discard a queued line that&#x27;s no longer true. <strong>Vector (maths)</strong> \u2014 a list of numbers treated as direction and magnitude. <strong>Weight (network)</strong> \u2014 a trainable parameter. <strong>Weight (scoring)</strong> \u2014 how much a target counts."}]}, {"k": "hr"}, {"k": "h1", "spans": [{"i": 395, "html": "Where to go deeper"}]}, {"k": "p", "spans": [{"i": 396, "html": "<strong>Vectors and geometry</strong> \u2014 3Blue1Brown, <em>Essence of Linear Algebra</em> (YouTube)."}, {"i": 397, "html": "The best explanation of dot products that exists, and it&#x27;s visual throughout."}]}, {"k": "p", "spans": [{"i": 398, "html": "<strong>Neural networks</strong> \u2014 3Blue1Brown&#x27;s <em>Neural Networks</em> series for intuition; then Andrej Karpathy&#x27;s *Neural Networks:"}, {"i": 399, "html": "Zero to Hero* if you want to build one from scratch."}, {"i": 400, "html": "Karpathy&#x27;s <em>micrograd</em> is ~150 lines and teaches backpropagation properly."}]}, {"k": "p", "spans": [{"i": 401, "html": "<strong>Pose estimation</strong> \u2014 the BlazePose paper (Google Research, 2020) is unusually readable, and you&#x27;ll recognise most of it from Part 2."}]}, {"k": "p", "spans": [{"i": 402, "html": "<strong>Signal processing</strong> \u2014 search &quot;exponential moving average time constant&quot;; the audio and control-systems literature treats this far more rigorously than the ML world does."}]}, {"k": "p", "spans": [{"i": 403, "html": "<strong>Architecture</strong> \u2014 Gary Bernhardt&#x27;s talk <em>Boundaries</em> is the clearest statement of the functional-core/imperative-shell pattern your engine now uses."}]}, {"k": "p", "spans": [{"i": 404, "html": "<strong>The most valuable exercise, though:</strong> re-read your own <code>Evaluator.evaluate</code> now."}, {"i": 405, "html": "It&#x27;s about 80 lines, and every concept in this document appears in it."}, {"i": 406, "html": "You&#x27;ll find you can read it line by line \u2014 and that&#x27;s the point."}]}], "queue": ["Form Coach, the concepts underneath", "What this is: every computing and machine-learning idea your system is built from, explained from zero, in the order the data actually flows.", "No prior knowledge assumed, Part 1 starts with what a number in space means.", "How to read it: one part per sitting.", "Each concept follows the same shape:", "The idea to the maths, only where it earns its place to where it lives in your code to what went wrong when we got it wrong.", "That last one matters most.", "Every bug this project has hit was a fundamental principle biting back, and a bug you've personally watched happen is worth ten pages of theory.", "Part 1, Numbers in space", "1.1 A point is two numbers", "Your camera sees a rectangle.", "To say where something is inside that rectangle, you need two numbers: how far across, and how far down.", "Two conventions worth burning in, because both bite people:", "We use 0 to 1, not pixels. A shoulder at x 0.5 is halfway across the frame whatever the resolution.", "This is called normalising, and it means the same code works on a 720p laptop webcam and a 4K phone.", "Your Joint type is exactly this: x, y, c.", "y increases DOWNWARDS. Screen coordinates inherit this from how old monitors drew scanlines, top to bottom.", "So a hip lower in the frame has a bigger y.", "Every time you read a threshold in the content and it feels upside down, this is why.", "1.2 A vector is a point used as an arrow", "You said you don't know what a vector is.", "Here it is, and it's genuinely this simple:", "A vector is a list of numbers. That's the whole definition. 3, 4 is a vector.", "What makes it useful is that we agree to interpret it as a direction and a distance rather than a location.", "The point 3, 4 means \"here\".", "The vector 3, 4 means \"3 across and 4 down from wherever you currently are\", an arrow, not a pin.", "Why the distinction earns its keep: joint positions are points, but everything you want to know is about relationships between them.", "\"Is the arm straight?\" isn't a question about where the elbow is; it's about the direction from elbow to shoulder versus the direction from elbow to wrist.", "Directions are vectors.", "Making a vector from two points, subtract:", "Your angle At function does exactly this in its first line:", "Two arrows, both starting at the joint you care about.", "Length of a vector, Pythagoras:", "In code that's hypot x, y.", "It's Pythagoras' theorem doing its only job.", "1.3 The dot product, and why it gives you angles", "This is the one piece of real maths in your geometry layer, so it's worth understanding rather than trusting.", "The operation: multiply matching components, add the results.", "What it means: the dot product measures how much two vectors agree.", "Pointing the same way to large positive number", "At right angles to exactly zero", "Pointing opposite ways to large negative number", "That zero-at-right-angles property is not a coincidence; it's the definition doing its work, and it's why the dot product turns up everywhere in graphics and physics.", "Getting the actual angle. The dot product also equals:", "where |v| is length and theta is the angle between them.", "Rearranged:", "Dividing by the lengths is called normalising, it strips out \"how long are these arrows\" and leaves only \"how much do they agree\", which is what an angle is.", "This is why your angle measurements don't care whether someone is close to the camera or far away.", "Your actual code, now fully readable:", "Two defensive details worth noticing, because both are real-world lessons:", "The 1e-9 guard. If two landmarks land on exactly the same spot, a vector has zero length, and you'd divide by zero, which in JavaScript gives Na N (\"not a number\"), a value that silently poisons every calculation it touches.", "Returning null instead makes the failure honest and visible.", "The clamp to [-1, 1]. arccos is only defined on that range.", "Floating-point arithmetic can produce 1.0000000000000002, and arccos of that is Na N.", "Clamping costs nothing and prevents a whole class of mystery bug.", "Radians vs degrees. Computers do trigonometry in radians (a full circle is 2pi approximately 6.28).", "Humans think in degrees (360). times 180 over pi converts.", "Your content is written in degrees because you have to read it.", "1.4 Projection: what a flat image throws away", "A camera takes a 3D world and flattens it to 2D.", "That flattening is called projection, and it is lossy, information is destroyed and cannot be recovered.", "Specifically: motion along the camera's viewing direction becomes invisible.", "This isn't a limitation of your code, your model, or your phone.", "It's geometry.", "It is the single most important constraint in your entire product, and it's the reason for the principle you landed on independently:", "**Only correct what you can measure.", "Teach what you cannot.**", "Concretely, from your honesty audit:", "Side-on, a squat's depth is beautifully visible (it happens across the image)", "Side-on, a squat's knee valgus, knees caving inward, is nearly invisible (it happens along the viewing direction)", "Two consequences you've already built:", "sideness estimates how side-on the body is.", "Below 25 degrees the coach stops making claims and asks the person to turn; between 25 degrees and 50 degrees it suppresses depth-dependent cues while keeping the ones that survive the angle.", "That's the engine reasoning about its own projection loss.", "cat-cow is guided, it makes no judgements at all, because per-segment spinal articulation cannot be seen from one camera.", "That movement is the reference standard for intellectual honesty in the whole system.", "1.5 Aspect ratio: the bug that geometry made inevitable", "Here's where normalised coordinates bite back, and it's worth walking through because it's subtle and you shipped it.", "Normalising x and y independently to 0 to 1 means one unit of x and one unit of y are not the same physical distance unless the frame is square.", "On a 1920 times 1080 frame (16:9), moving 0.1 in x is 192 pixels; moving 0.1 in y is 108 pixels.", "So a 45 degrees angle in the real world measures as something else entirely in normalised space.", "The image is stretched, and every angle is stretched with it.", "The fix, in your read Metric:", "Multiplying x by the aspect ratio restores physical proportions before any angle is computed.", "Same shape, same measurement, portrait or landscape.", "The lesson: normalisation is a convenience, and every convenience quietly encodes an assumption.", "This one assumed square pixels in a square frame.", "1.6 Point-to-line distance: the line metric", "Your other geometric measure answers \"is this joint sitting on the line between these two other joints?\", which is exactly \"is the body straight?\"", "The method: figure out how far along the shoulder to ankle line the hip sits horizontally (call that fraction u ), work out where the hip would be at that fraction if the body were perfectly straight, and subtract.", "The result is signed, which is why it can distinguish sag from pike where an angle cannot, positive one way, negative the other.", "That's why hip Align can say two different things and body Line (an angle) can only say \"not straight\".", "And the guard that mattered:", "If the two reference joints are vertically stacked, shoulder directly above ankle, i.e. a standing person, then dx approximately 0 and u explodes toward infinity.", "When I added grading to wall-push-up I had to use an angle rather than a line for exactly this reason: a standing body has no horizontal extent, so the line metric would have returned a constant 0 and silently graded everyone perfect.", "Part 2, From light to landmarks", "2.1 What a video frame actually is", "A digital image is a grid of pixels, each storing brightness for red, green and blue, typically 0-255 each, one byte apiece.", "A 1920 times 1080 frame is about 2 million pixels, ~6 MB raw.", "Video is just many of these per second. 30 F P S means a new 6 MB grid every 33 milliseconds.", "Nothing in the image says \"shoulder\".", "It's a wall of numbers, and something has to find meaning in it.", "2.2 Why this needs machine learning", "Could you write rules?", "\"Skin-coloured pixels near the top are probably a head.\" People have tried for decades.", "It fails immediately on: different skin tones, clothing, lighting, backgrounds, occlusion, unusual poses, camera angles.", "The reason is that the mapping from pixels to \"where is the shoulder\" is enormously complicated and nobody can write it down.", "That is precisely the situation machine learning exists for:", "Instead of writing the rules, show the computer millions of examples and let it find a function that fits them.", "2.3 Neural networks, honestly", "A neural network is a big mathematical function with adjustable numbers inside, called parameters or weights.", "One neuron: take several inputs, multiply each by a weight, add them up, add a bias, then apply a simple non-linear squash (an activation function).", "The multiply-and-add part is a dot product, the same operation from section 1.3, doing a completely different job.", "That's not a coincidence:", "\"weighted combination of inputs\" is one of the most reusable ideas in all of computing.", "The squash matters enormously.
